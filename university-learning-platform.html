<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourseCore — 大学基础课学习平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #6e6e73;
      --line: #e5e5e5;
      --accent: #000000;
      --card: #f5f5f7;
      --hover: #f0f0f0;
      --success: #2d4e3e;
      --warn: #8b5a00;
    }
    [data-theme="dark"] {
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #a1a1a6;
      --line: #333333;
      --accent: #ffffff;
      --card: #111111;
      --hover: #1a1a1a;
      --success: #4caf50;
      --warn: #ffb800;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.25s ease, color 0.25s ease;
      min-height: 100vh;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
    }
    .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.2s ease;
    }
    .btn-pill:hover { transform: scale(1.02); }
    .btn-pill:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--hover); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      padding: 1.5rem;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    }
    .card-hover:hover { transform: translateY(-2px); }
    .module-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 0.875rem;
      background: transparent;
      border: 1px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .module-header:hover { background: var(--hover); border-color: var(--line); }
    .item-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border-radius: 0.75rem;
      color: var(--fg);
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .item-row:hover { background: var(--hover); }
    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid var(--line);
    }
    .status-done { background: var(--success); border-color: var(--success); }
    .status-current { background: var(--warn); border-color: var(--warn); }
    .status-todo { background: transparent; }
    .type-tag {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
      border: 1px solid var(--line);
      color: var(--muted);
      flex-shrink: 0;
    }
    .kind-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--bg);
      flex-shrink: 0;
    }
    .progress-bar {
      height: 0.375rem;
      border-radius: 9999px;
      background: var(--line);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: var(--accent);
      transition: width 0.4s cubic-bezier(0.2, 0, 0.2, 1);
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9999px;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      color: var(--fg);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(128,128,128,0.15); }
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .sidebar {
      position: fixed;
      top: 4rem;
      left: 0;
      bottom: 0;
      width: 18rem;
      border-right: 1px solid var(--line);
      background: rgba(var(--bg), 0.92);
      backdrop-filter: blur(12px);
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 20;
    }
    .sidebar.open { transform: translateX(0); }
    @media (min-width: 1024px) {
      .sidebar { position: sticky; top: 4rem; transform: translateX(0); }
      .menu-toggle { display: none; }
    }
    .main-content { flex: 1; min-width: 0; }
    .course-card:hover { transform: translateY(-2px); }
    .course-card { transition: transform 0.2s ease; }
    .answer-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      color: var(--fg);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .answer-input:focus { border-color: var(--accent); }
    .solution-box {
      border-left: 2px solid var(--accent);
      padding-left: 1rem;
      margin-top: 1rem;
      color: var(--fg);
    }
    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      transition: color 0.15s ease;
    }
    .nav-link:hover, .nav-link.active { color: var(--fg); }
    .tab-btn {
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .tab-btn.active { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="app">
    <header class="sticky top-0 z-30 border-b" style="background: rgba(var(--bg), 0.82); border-color: var(--line); backdrop-filter: blur(14px);">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="menu-toggle" class="menu-toggle p-2 rounded-lg hover:bg-[var(--hover)]" aria-label="切换菜单">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <a href="#" class="flex items-center gap-2" onclick="showLanding(); return false;">
            <div class="w-8 h-8 rounded-full border flex items-center justify-center" style="border-color: var(--accent);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
            </div>
            <span class="text-xl font-bold tracking-tight">CourseCore</span>
          </a>
        </div>
        <div class="hidden md:flex items-center gap-6">
          <nav class="flex items-center gap-5">
            <a href="#" class="nav-link active" id="nav-learn" onclick="showLanding('learn'); return false;">学习</a>
            <a href="#" class="nav-link" id="nav-kb" onclick="showKnowledgeBase(); return false;">知识库</a>
            <a href="#" class="nav-link" id="nav-bank" onclick="showPracticeBank(); return false;">刷题</a>
          </nav>
          <div class="search-wrap w-56">
            <span class="search-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input id="global-search" class="search-input" type="text" placeholder="查找课程、题型或试卷…">
          </div>
          <button id="theme-toggle" class="p-2 rounded-full hover:bg-[var(--hover)]" aria-label="切换主题">
            <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
          <a href="#" class="btn-pill btn-primary" onclick="showLanding('learn'); return false;">开始学习</a>
        </div>
      </div>
    </header>

    <div class="flex flex-1 max-w-7xl mx-auto w-full">
      <aside id="sidebar" class="sidebar p-4">
        <div class="search-wrap mb-4 lg:hidden">
          <span class="search-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input id="sidebar-search" class="search-input" type="text" placeholder="在课程中查找…">
        </div>
        <div id="course-list" class="space-y-1"></div>
      </aside>

      <main id="main" class="main-content px-4 sm:px-6 lg:px-10 py-8 lg:py-12">
        <!-- 动态内容 -->
      </main>
    </div>

    <footer class="border-t mt-auto" style="border-color: var(--line);">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
          <div>
            <div class="flex items-center gap-2 mb-4">
              <div class="w-7 h-7 rounded-full border flex items-center justify-center" style="border-color: var(--accent);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
              </div>
              <span class="font-bold">CourseCore</span>
            </div>
            <p class="text-sm" style="color: var(--muted);">帮助大学生系统掌握基础课，从概念到考题逐步拆解。</p>
          </div>
          <div>
            <h4 class="font-semibold mb-3">课程</h4>
            <ul class="space-y-2 text-sm" style="color: var(--muted);">
              <li><a href="#" class="hover:text-[var(--fg)]" onclick="showCourse('calculus-1'); return false;">高等数学</a></li>
              <li><a href="#" class="hover:text-[var(--fg)]" onclick="showCourse('physics-mechanics'); return false;">大学物理</a></li>
              <li><a href="#" class="hover:text-[var(--fg)]" onclick="showCourse('linear-algebra'); return false;">线性代数</a></li>
              <li><a href="#" class="hover:text-[var(--fg)]" onclick="showCourse('probability'); return false;">概率统计</a></li>
            </ul>
          </div>
          <div>
            <h4 class="font-semibold mb-3">资源</h4>
            <ul class="space-y-2 text-sm" style="color: var(--muted);">
              <li><a href="#" class="hover:text-[var(--fg)]" onclick="showKnowledgeBase(); return false;">知识库</a></li>
              <li><a href="#" class="hover:text-[var(--fg)]" onclick="showPracticeBank(); return false;">刷题</a></li>
              <li><a href="#" class="hover:text-[var(--fg)]" onclick="showExamPapers(); return false;">期末试卷</a></li>
            </ul>
          </div>
          <div>
            <h4 class="font-semibold mb-3">关于</h4>
            <ul class="space-y-2 text-sm" style="color: var(--muted);">
              <li><a href="#" class="hover:text-[var(--fg)]">关于我们</a></li>
              <li><a href="#" class="hover:text-[var(--fg)]">使用条款</a></li>
              <li><a href="#" class="hover:text-[var(--fg)]">隐私政策</a></li>
            </ul>
          </div>
        </div>
        <div class="mt-10 pt-6 border-t text-center text-xs" style="border-color: var(--line); color: var(--muted);">
          (c) 2026 CourseCore. 内容仅供学习交流，课程数据可自由改造。
        </div>
      </div>
    </footer>
  </div>

  <script>
    const PLATFORM = {
      name: "CourseCore",
      tagline: "大学基础课的系统化学习平台"
    };

    const COURSES = [
      {
        id: "calculus-1",
        title: "高等数学（上）",
        description: "从数列极限到微分方程，系统掌握一元微积分核心思想与计算方法。",
        requirements: [
          "完成全部 6 个模块的理论与练习",
          "通过 5 次模块测验",
          "完成 1 个结课认证项目"
        ],
        modules: [
          { id: "c1-m1", title: "极限与连续", items: [
            { id: "c1-m1-i1", type: "theory", title: "数列极限的 ε-N 定义" },
            { id: "c1-m1-i2", type: "example", title: "用定义证明 lim 1/n = 0" },
            { id: "c1-m1-i3", type: "practice", title: "计算基本极限" },
            { id: "c1-m1-i4", type: "quiz", title: "极限与连续小测" }
          ]},
          { id: "c1-m2", title: "导数与微分", items: [
            { id: "c1-m2-i1", type: "theory", title: "导数的几何与物理意义" },
            { id: "c1-m2-i2", type: "example", title: "求导法则综合运用" },
            { id: "c1-m2-i3", type: "practice", title: "隐函数与参数方程求导" },
            { id: "c1-m2-i4", type: "quiz", title: "导数与微分小测" }
          ]},
          { id: "c1-m3", title: "微分中值定理", items: [
            { id: "c1-m3-i1", type: "theory", title: "Rolle、Lagrange、Cauchy 定理" },
            { id: "c1-m3-i2", type: "example", title: "证明不等式与等式" },
            { id: "c1-m3-i3", type: "practice", title: "Taylor 展开练习" },
            { id: "c1-m3-i4", type: "quiz", title: "中值定理小测" }
          ]},
          { id: "c1-m4", title: "不定积分", items: [
            { id: "c1-m4-i1", type: "theory", title: "原函数与不定积分概念" },
            { id: "c1-m4-i2", type: "example", title: "换元法与分部积分" },
            { id: "c1-m4-i3", type: "practice", title: "有理函数积分" },
            { id: "c1-m4-i4", type: "quiz", title: "不定积分小测" }
          ]},
          { id: "c1-m5", title: "定积分", items: [
            { id: "c1-m5-i1", type: "theory", title: "定积分定义与性质" },
            { id: "c1-m5-i2", type: "example", title: "变上限积分与 Newton-Leibniz" },
            { id: "c1-m5-i3", type: "practice", title: "定积分应用：面积与体积" },
            { id: "c1-m5-i4", type: "quiz", title: "定积分小测" }
          ]},
          { id: "c1-m6", title: "微分方程", items: [
            { id: "c1-m6-i1", type: "theory", title: "一阶微分方程类型" },
            { id: "c1-m6-i2", type: "example", title: "二阶常系数线性方程" },
            { id: "c1-m6-i3", type: "project", title: "人口增长模型项目" },
            { id: "c1-m6-i4", type: "review", title: "高等数学（上）总复习" }
          ]}
        ]
      },
      {
        id: "physics-mechanics",
        title: "大学物理（力学）",
        description: "从质点运动学到刚体转动，建立经典力学的概念框架与解题体系。",
        requirements: [
          "完成全部 5 个模块的理论与实验",
          "通过 4 次模块测验",
          "完成 1 个结课认证项目"
        ],
        modules: [
          { id: "pm-m1", title: "质点运动学", items: [
            { id: "pm-m1-i1", type: "theory", title: "位置、速度、加速度矢量" },
            { id: "pm-m1-i2", type: "example", title: "曲线运动的自然坐标描述" },
            { id: "pm-m1-i3", type: "practice", title: "相对运动与伽利略变换" },
            { id: "pm-m1-i4", type: "quiz", title: "运动学小测" }
          ]},
          { id: "pm-m2", title: "牛顿运动定律", items: [
            { id: "pm-m2-i1", type: "theory", title: "牛顿三定律与常见力" },
            { id: "pm-m2-i2", type: "example", title: "连接体与约束问题" },
            { id: "pm-m2-i3", type: "practice", title: "非惯性系与惯性力" },
            { id: "pm-m2-i4", type: "quiz", title: "牛顿定律小测" }

          { id: "pm-m3", title: "动量与能量", items: [
            { id: "pm-m3-i1", type: "theory", title: "动量定理与守恒" },
            { id: "pm-m3-i2", type: "example", title: "碰撞问题" },
            { id: "pm-m3-i3", type: "practice", title: "功、能与机械能守恒" },
            { id: "pm-m3-i4", type: "quiz", title: "动量与能量小测" }
          ]},
          { id: "pm-m4", title: "刚体转动", items: [
            { id: "pm-m4-i1", type: "theory", title: "转动惯量与定轴转动" },
            { id: "pm-m4-i2", type: "example", title: "角动量守恒应用" },
            { id: "pm-m4-i3", type: "practice", title: "转动中的能量问题" },

          { id: "pm-m5", title: "万有引力与综合", items: [
            { id: "pm-m5-i1", type: "theory", title: "万有引力定律" },

            { id: "pm-m5-i4", type: "review", title: "力学总复习" }
          ]}
        ]
      },
      {
        id: "linear-algebra",
        title: "线性代数",
        description: "从行列式到特征值，理解向量空间、线性变换与矩阵计算。",
        requirements: [
          "完成全部 5 个模块的理论与练习",
          "通过 4 次模块测验",
          "完成 1 个结课认证项目"
        ],
        modules: [
          { id: "la-m1", title: "行列式", items: [
            { id: "la-m1-i1", type: "theory", title: "行列式的定义与性质" },
            { id: "la-m1-i2", type: "example", title: "计算 n 阶行列式" },
            { id: "la-m1-i3", type: "practice", title: "Cramer 法则" },
            { id: "la-m1-i4", type: "quiz", title: "行列式小测" }

          { id: "la-m2", title: "矩阵", items: [

            { id: "la-m2-i2", type: "example", title: "分块矩阵技巧" },
            { id: "la-m2-i3", type: "practice", title: "矩阵方程" },
            { id: "la-m2-i4", type: "quiz", title: "矩阵小测" }
          ]},
          { id: "la-m3", title: "向量空间", items: [
            { id: "la-m3-i1", type: "theory", title: "线性相关与基" },
            { id: "la-m3-i2", type: "example", title: "求秩与极大无关组" },
            { id: "la-m3-i3", type: "practice", title: "子空间与维数" },
            { id: "la-m3-i4", type: "quiz", title: "向量空间小测" }
          ]},

    function getTotalItems(course) {
      return course.modules.reduce((sum, m) => sum + m.items.length, 0);

      return course.modules.reduce((sum, m) => sum + m.items.filter(i => state.progress[i.id]).length, 0);
    }

      return state.progress[itemId] ? "done" : "todo";

      saveProgress();
      renderSidebar();
      if (state.currentCourseId) renderCourse(state.currentCourseId);

      state.expanded[moduleId] = !state.expanded[moduleId];

    function renderSidebar() {
      const list = document.getElementById("course-list");
      if (state.view !== 'landing' && state.view !== 'course') {
        list.innerHTML = `<div class="text-sm px-2 py-3" style="color:var(--muted)">当前不在课程视图，可从顶部导航进入学习/刷题。</div>`;
        return;
      }
      const term = state.search.toLowerCase().trim();
      list.innerHTML = COURSES.map(course => {
        const total = getTotalItems(course);
        const done = getCompletedCount(course);
        const courseMatch = !term || course.title.toLowerCase().includes(term) || course.description.toLowerCase().includes(term);
        let hasVisibleItem = false;
        const modulesHtml = course.modules.map(m => {
          const expanded = !!state.expanded[m.id];
          const itemsHtml = m.items.map(i => {
            const match = !term || i.title.toLowerCase().includes(term) || TYPE_LABELS[i.type].includes(term);
            if (match) hasVisibleItem = true;
            if (term && !match) return "";
            const status = getStatus(i.id);
            const onclick = i.type === 'practice' ? `showPracticeItem('${i.id}')` : `toggleItem('${i.id}')`;
            return `<a href="#" class="item-row" onclick="${onclick}; return false;">
              <span class="status-dot ${status === 'done' ? 'status-done' : 'status-todo'}"></span>
              <span class="type-tag">${TYPE_LABELS[i.type]}</span>
              <span class="text-sm truncate" style="color: var(--fg);">${escapeHtml(i.title)}</span>
            </a>`;
          }).join("");
          const moduleMatch = !term || m.title.toLowerCase().includes(term);
          const showModule = moduleMatch || hasVisibleItem || !term;
          if (!showModule) return "";
          return `<div class="mb-1">
            <button class="module-header" onclick="toggleModule('${m.id}')">
              <span class="text-sm font-semibold text-left" style="color: var(--fg);">${escapeHtml(m.title)}</span>
              <svg class="transition-transform duration-200 ${expanded ? 'rotate-180' : ''}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="overflow-hidden transition-all duration-250 ${expanded ? 'max-h-screen opacity-100' : 'max-h-0 opacity-0'}">
              ${itemsHtml}
            </div>
          </div>`;
        }).join("");
        if (!courseMatch && !hasVisibleItem && term) return "";
        return `<div class="mb-4">
          <button class="w-full text-left px-2 py-2 rounded-lg hover:bg-[var(--hover)] transition-colors" onclick="showCourse('${course.id}')">
            <div class="flex items-center justify-between">

      }).join("");
    }

    function renderKnowledgeBase() {
      const term = state.search.toLowerCase().trim();

        const done = state.completedQuestions[q.id];

      });
      const grouped = {};
      visibleQuestions.forEach(q => {
        const key = KIND_LABELS[q.kind];
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(q);
      });

                ${qs.map(q => `

        renderKnowledgeBase();

    function checkAnswer(qid) {
      const q = QUESTIONS.find(x => x.id === qid);
      if (!q) return;
      let userAns = '';
      if (q.options) {
        const selected = document.querySelector('input[name="q-choice"]:checked');
        userAns = selected ? selected.value : '';
      } else {
        userAns = document.getElementById('user-answer').value.trim();
      }
      if (userAns === '') { alert('请先输入或选择答案'); return; }
      const correct = String(userAns).toLowerCase().replace(/\s+/g, '') === String(q.answer).toLowerCase().replace(/\s+/g, '');
      markQuestion(qid, correct);
      document.getElementById('solution-box').classList.remove('hidden');
      alert(correct ? '回答正确，已解锁解法。' : '回答错误，已解锁解法供参考。');
    }

    function checkExamAnswer(examId, qid) {
      const exam = EXAM_PAPERS.find(e => e.id === examId);
      const q = exam.sections.flatMap(s => s.questions).find(x => x.id === qid);
      if (!q) return;
      let userAns = '';
      if (q.options) {
        const selected = document.querySelector('input[name="q-choice"]:checked');
        userAns = selected ? selected.value : '';
      } else {
        userAns = document.getElementById('user-answer').value.trim();
      }
      if (userAns === '') { alert('请先输入或选择答案'); return; }
      const correct = String(userAns).toLowerCase().replace(/\s+/g, '') === String(q.answer).toLowerCase().replace(/\s+/g, '');
      markQuestion(qid, correct);
      document.getElementById('solution-box').classList.remove('hidden');
      alert(correct ? '回答正确，已解锁解法。' : '回答错误，已解锁解法供参考。');
    }

    function historyBack() {
      if (state.view === 'practice' && state.examContext) {
        showExamPaper(state.examContext);
      } else if (state.view === 'practice') {
        showPracticeBank();
      } else {
        showLanding();
      }
    }

    function courseTitle(courseId) {
      const c = COURSES.find(x => x.id === courseId);
      return c ? c.title : "";
    }

    function moduleTitle(courseId, moduleId) {
      const c = COURSES.find(x => x.id === courseId);
      if (!c) return "";
      const m = c.modules.find(x => x.id === moduleId);
      return m ? m.title : "";
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    }

    function initBackground() {
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      let w, h, horizon, focal, zMove = 0;
      let raf;
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        horizon = h * 0.38;
        focal = Math.min(w, h) * 0.55;
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const isDark = state.theme === "dark";
        ctx.strokeStyle = isDark ? "rgba(255,255,255,0.10)" : "rgba(0,0,0,0.08)";
        ctx.lineWidth = 1;
        const maxZ = Math.max(w, h) * 2.5;
        const stepZ = Math.max(30, Math.min(w, h) * 0.04);
        for (let z = 20; z < maxZ; z += stepZ) {
          const depth = z + zMove;
          const y = horizon + focal * 120 / depth;
          if (y > h + 20) continue;
          ctx.globalAlpha = Math.max(0, 1 - depth / maxZ) * 0.8;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
        for (let x = -w; x <= w * 2; x += stepZ * 1.6) {
          ctx.beginPath();
          for (let z = 20; z < maxZ; z += stepZ * 0.8) {
            const depth = z + zMove;
            const y = horizon + focal * 120 / depth;
            const sx = w / 2 + (x - w / 2) * focal / depth;
            ctx.lineTo(sx, y);
          }
          ctx.globalAlpha = 0.25;
          ctx.stroke();
        }
        zMove += 0.25;
        if (zMove > stepZ) zMove -= stepZ;
        raf = requestAnimationFrame(draw);
      }
      resize();
      window.addEventListener("resize", resize);
      draw();
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (reduce.matches) cancelAnimationFrame(raf);
      reduce.addEventListener("change", e => {
        if (e.matches) cancelAnimationFrame(raf); else draw();
      });
    }

    function init() {
      loadProgress();
      setTheme(state.theme);
      document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
      document.getElementById("menu-toggle").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
      });
      const globalSearch = document.getElementById("global-search");
      const sidebarSearch = document.getElementById("sidebar-search");
      [globalSearch, sidebarSearch].forEach(input => {
        if (!input) return;
        input.addEventListener("input", e => {
          state.search = e.target.value;
          if (state.view === 'knowledge') renderKnowledgeBase();
          else if (state.view === 'bank') renderPracticeBank();
          else renderSidebar();
        });
      });
      renderSidebar();
      showLanding();
      initBackground();
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
