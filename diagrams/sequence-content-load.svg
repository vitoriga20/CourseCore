<svg viewBox="0 0 680 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>试卷题库内容加载时序图</title>
<desc>刷题视图经 practice-data 服务加载试卷：先查本地缓存，未命中走 BFF content(/papers) 从 Supabase 取数并写 KV 缓存；BFF 失败时降级到静态打包的 EXAM_PAPERS</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.t{font:500 13px var(--font-sans,sans-serif);fill:#D3D1C7}
.lab{font:400 11px var(--font-sans,sans-serif);fill:#c9cdd4}
.life{stroke:#5F5E5A;stroke-width:.5;stroke-dasharray:4 4}
.box{fill:#2C2C2A;stroke:#B4B2A9;stroke-width:.5}
.arr{stroke:#9aa0a6;stroke-width:1.5;fill:none}
.dash{stroke:#9aa0a6;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.frame{stroke:#5F5E5A;stroke-width:.5;stroke-dasharray:6 4;fill:none}
.flab{font:400 11px var(--font-sans,sans-serif);fill:#B4B2A9}
.note{font:400 11px var(--font-sans,sans-serif);fill:#9aa0a6}
</style>
<text class="t" x="340" y="24" text-anchor="middle">时序图 · 试卷/题库内容加载（含降级）</text>

<rect class="box" x="50" y="40" width="100" height="40" rx="8"/>
<text class="lab" x="100" y="64" text-anchor="middle">刷题视图</text>
<rect class="box" x="170" y="40" width="100" height="40" rx="8"/>
<text class="lab" x="220" y="64" text-anchor="middle">practice-data</text>
<rect class="box" x="290" y="40" width="100" height="40" rx="8"/>
<text class="lab" x="340" y="64" text-anchor="middle">BFF content</text>
<rect class="box" x="410" y="40" width="100" height="40" rx="8"/>
<text class="lab" x="460" y="64" text-anchor="middle">Supabase</text>
<rect class="box" x="530" y="40" width="100" height="40" rx="8"/>
<text class="lab" x="580" y="64" text-anchor="middle">静态 bundle</text>

<line class="life" x1="100" y1="80" x2="100" y2="418"/>
<line class="life" x1="220" y1="80" x2="220" y2="418"/>
<line class="life" x1="340" y1="80" x2="340" y2="418"/>
<line class="life" x1="460" y1="80" x2="460" y2="418"/>
<line class="life" x1="580" y1="80" x2="580" y2="418"/>

<rect class="frame" x="40" y="158" width="600" height="186"/>
<text class="flab" x="52" y="172">BFF 可用</text>
<rect class="frame" x="40" y="350" width="600" height="70"/>
<text class="flab" x="52" y="364">else 静态 fallback</text>

<line class="arr" x1="100" y1="104" x2="220" y2="104" marker-end="url(#arrow)"/>
<text class="lab" x="160" y="98">getExamPapers()</text>
<path class="arr" d="M220 132 L252 132 L252 150 L220 150" marker-end="url(#arrow)"/>
<text class="lab" x="150" y="126">查缓存: 内存→本地</text>
<line class="arr" x1="220" y1="176" x2="340" y2="176" marker-end="url(#arrow)"/>
<text class="lab" x="280" y="170">GET /api/v1/papers</text>
<line class="arr" x1="340" y1="212" x2="460" y2="212" marker-end="url(#arrow)"/>
<text class="lab" x="400" y="206">select 试卷/题 (字段裁剪)</text>
<line class="arr" x1="460" y1="248" x2="340" y2="248" marker-end="url(#arrow)"/>
<text class="lab" x="400" y="242">内容行 (分页)</text>
<line class="arr" x1="340" y1="284" x2="220" y2="284" marker-end="url(#arrow)"/>
<text class="lab" x="280" y="278">200 嵌套试卷 + 写 KV</text>
<line class="arr" x1="220" y1="320" x2="100" y2="320" marker-end="url(#arrow)"/>
<text class="lab" x="160" y="314">返回试卷/题库</text>

<line class="dash" x1="220" y1="386" x2="580" y2="386" marker-end="url(#arrow)"/>
<text class="lab" x="400" y="380">fetch 失败 → fallback</text>
<line class="dash" x1="580" y1="404" x2="220" y2="404" marker-end="url(#arrow)"/>
<text class="lab" x="400" y="398">返回 EXAM_PAPERS</text>

<text class="note" x="40" y="442">BFF 另读/写 KV 边缘缓存（TTL）以卸载 Supabase 读压力；命中缓存时跳过数据库查询</text>
</svg>
