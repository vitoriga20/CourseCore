# ============================================================
# 可选：独立 Cloudflare Workers 部署（非默认）
# 默认部署形态是「Pages Functions 同域」，见根目录 wrangler.toml。
# 仅当你想把 API 独立成 api.xxx.workers.dev 时才用本文件：
#   cd bff && npx wrangler deploy
# ============================================================
name = "coursecore-bff"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# ---- 环境变量（非敏感，可明文） ----
[vars]
SUPABASE_URL = "https://npmfeeeyeuienekezmil.supabase.co"
CONTENT_CACHE_TTL = "300"

# ---- 敏感密钥（用 wrangler secret put 设置，切勿提交） ----
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   -> 服务端专用 service_role key，只在 Worker 内使用，绝不暴露给浏览器
#
# ---- 可选：限流用的 KV 命名空间 ----
#   先创建：wrangler kv namespace create RATE_LIMIT_KV
#   把返回的 id 填到下面的 id 字段
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_YOUR_KV_ID"

# ---- 路由（可选）：绑定自定义域名 ----
# routes = [
#   { pattern = "api.coursecore.com", custom_domain = true }
# ]
