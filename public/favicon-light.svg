<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 朴素米白背景 -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f2eb"/>
      <stop offset="100%" stop-color="#e8e4da"/>
    </linearGradient>

    <!-- 蛇身：深褐灰，朴素 -->
    <linearGradient id="snake-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="50%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>

    <filter id="soft-shadow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg-light)"/>

  <g fill="none" stroke="#2a2a2a" stroke-opacity="0.08" stroke-width="1">
    <circle cx="64" cy="64" r="54"/>
    <circle cx="64" cy="64" r="44"/>
    <circle cx="64" cy="64" r="34"/>
    <circle cx="64" cy="64" r="24"/>
  </g>

  <g stroke="#2a2a2a" stroke-opacity="0.1" stroke-width="1">
    <line x1="22" y1="44" x2="106" y2="44"/>
    <line x1="22" y1="64" x2="106" y2="64"/>
    <line x1="22" y1="84" x2="106" y2="84"/>
    <line x1="44" y1="22" x2="44" y2="106"/>
    <line x1="64" y1="22" x2="64" y2="106"/>
    <line x1="84" y1="22" x2="84" y2="106"/>
  </g>

  <g filter="url(#soft-shadow-light)">
    <path
      d="M 32 88
         L 32 56
         L 48 56
         L 48 72
         L 64 72
         L 64 48
         L 48 48
         L 48 32
         L 88 32
         L 88 88
         L 96 88"
      fill="none"
      stroke="url(#snake-dark)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <g fill="#f5f2eb">
      <circle cx="32" cy="72" r="2.2"/>
      <circle cx="32" cy="60" r="2.2"/>
      <circle cx="40" cy="56" r="2.2"/>
      <circle cx="48" cy="64" r="2.2"/>
      <circle cx="48" cy="72" r="2.2"/>
      <circle cx="56" cy="72" r="2.2"/>
      <circle cx="64" cy="60" r="2.2"/>
      <circle cx="64" cy="48" r="2.2"/>
      <circle cx="56" cy="48" r="2.2"/>
      <circle cx="48" cy="40" r="2.2"/>
      <circle cx="64" cy="32" r="2.2"/>
      <circle cx="76" cy="32" r="2.2"/>
      <circle cx="88" cy="44" r="2.2"/>
      <circle cx="88" cy="60" r="2.2"/>
      <circle cx="88" cy="76" r="2.2"/>
      <circle cx="92" cy="88" r="2.2"/>
    </g>
  </g>

  <g transform="translate(96, 88) rotate(-45)">
    <polygon points="0,-8 12,0 0,8" fill="#3d3d3d"/>
    <circle cx="3" cy="0" r="2" fill="#f5f2eb"/>
  </g>

  <g transform="translate(40, 44)" opacity="0.85">
    <polygon points="0,-8 7,6 -7,6" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
  </g>

  <g transform="translate(80, 72)" opacity="0.85">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#5a5a5a"/>
  </g>

  <g fill="#5a5a5a">
    <circle cx="32" cy="88" r="2.5"/>
    <circle cx="48" cy="72" r="2.5"/>
    <circle cx="64" cy="72" r="2.5"/>
    <circle cx="48" cy="32" r="2.5"/>
    <circle cx="88" cy="32" r="2.5"/>
    <circle cx="88" cy="88" r="2.5"/>
  </g>

  <g transform="translate(64, 116)" stroke="#2a2a2a" stroke-opacity="0.18" stroke-width="1">
    <line x1="-18" y1="0" x2="18" y2="0"/>
    <line x1="-18" y1="-3" x2="-18" y2="3"/>
    <line x1="0" y1="-2" x2="0" y2="2"/>
    <line x1="18" y1="-3" x2="18" y2="3"/>
  </g>
</svg>
