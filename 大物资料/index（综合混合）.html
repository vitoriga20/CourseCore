            --bg-color: #f3f6f4;
            --text-color: #2d4e3e;
            --border-color: rgba(45, 78, 62, 0.18);
            --accent-color: #2d4e3e;
            --muted-color: rgba(45, 78, 62, 0.58);

            --card-bg: rgba(255, 255, 255, 0.76);

            --correct-bg: rgba(45, 78, 62, 0.10);
            --correct-border: #2d4e3e;
            --hover-text-color: #3d6b56;
            --wrong-bg: rgba(139, 58, 58, 0.08);
            --wrong-border: #8b3a3a;
            --question-font: var(--font-serif);
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-serif: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
            --font-mono: "SF Mono", "JetBrains Mono", SFMono-Regular, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: var(--font-sans);
            background: transparent;
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

        body[data-bg="plain"] {

        #bg-canvas {

            z-index: 0;

        .font-mono { font-family: var(--font-mono); }

        .geo-card {

        }
        .geo-btn {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-color);
            font-family: var(--font-sans);
            border-radius: 9999px;
            transition: all 0.2s ease-out;

        .geo-btn:hover:not(:disabled) {

            color: var(--text-on-accent-color);
            border-color: var(--accent-color);

        .geo-primary {
            background: var(--accent-color);
            color: var(--text-on-accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 9999px;

        .geo-primary:hover:not(:disabled) {
            background: #3d6b56;
            border-color: #3d6b56;

            box-shadow: 0 6px 20px rgba(45, 78, 62, 0.18);

            position: sticky;

            z-index: 40;

            color: var(--text-on-accent-color);
            border-color: var(--accent-color);
        }

        .progress-bar > div { height: 100%; background: var(--accent-color); width: 0%; transition: width 0.3s ease-out; }
        .nav-btn {
            aspect-ratio: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease-out;
        }
        .nav-btn:hover:not(.current):not(.correct):not(.wrong):not(:disabled) {

        }

        .nav-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-border); }
        .nav-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong-border); }
        .option-btn {
            text-align: left;
            padding: 1rem 1.125rem;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-color);
            display: block;
            width: 100%;
            font-family: var(--question-font);
            font-size: 1rem;

            cursor: pointer;
        }

            background: rgba(45, 78, 62, 0.05);
            color: var(--hover-text-color);
            border-color: rgba(45, 78, 62, 0.28);
            transform: translateY(-1px);
        }
        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); }
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
        .option-btn.correct, .option-btn.wrong { color: var(--text-color); }
        .question-body {
            font-family: var(--question-font);
            font-size: 1.125rem;
            line-height: 1.85;
        }
        .question-figure {
            margin: 1.25rem 0;

            border: 1px solid var(--border-color);

        .feedback {
            border-left: 3px solid var(--border-color);
            padding-left: 1rem;
            margin-top: 1rem;
            font-family: var(--question-font);
            line-height: 1.75;

        }
        .feedback.correct { border-color: var(--correct-border); }
        .feedback.wrong { border-color: var(--wrong-border); }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        input, textarea {
            font-family: var(--font-mono);
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: rgba(45, 78, 62, 0.45);
            box-shadow: 0 0 0 3px rgba(45, 78, 62, 0.08);
        }
        @media (max-width: 640px) {
            .geo-card { border-radius: 20px; }
            .nav-btn { border-radius: 10px; }
        }

    <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      chtml: { fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2' }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
</head>
<body data-bg="geo">
    <div id="bg-canvas"></div>
    <script>
        (function() {
            const params = {
                seed: 12345,
                sphereRadius: 1200,
                gridDensity: 6,
                noiseAmp: 12,
                rotationSpeed: 0.00015,
                viewOffsetX: Math.PI / 2,
                starCount: 28,
                equatorStarCount: 6,
                lineWeight: 0.8,
                particleCount: 0,
                trailLength: 10
            };
            let particles = [];
            let stars = [];
            let spherePoints = [];
            let time = 0;
            let focalLength = 1500;
            let container;
            let canvas;
            let isVisible = true;
            let primaryColor, secondaryColor, bgColor;

            function setup() {
                container = document.getElementById('bg-canvas');
                if (!container) return;
                canvas = createCanvas(container.clientWidth, container.clientHeight);
                canvas.parent('bg-canvas');
                pixelDensity(1);
                frameRate(15);
                updateColors();
                initializeSystem();
                window.addEventListener('resize', onResize);
            }

            function onResize() {
                if (!container) return;
                resizeCanvas(container.clientWidth, container.clientHeight);
            }

            function updateColors() {
                const style = getComputedStyle(document.body);
                primaryColor = style.getPropertyValue('--text-color').trim() || '#2d4e3e';
                secondaryColor = style.getPropertyValue('--muted-color').trim() || 'rgba(45,78,62,0.58)';
                bgColor = style.getPropertyValue('--bg-color').trim() || '#f3f6f4';
            }

            function initializeSystem() {
                randomSeed(params.seed);
                noiseSeed(params.seed);
                time = 0;
                precomputeSpherePoints();
                stars = [];
                let eqCount = params.equatorStarCount || 0;
                for (let i = 0; i < eqCount; i++) {
                    let theta = HALF_PI + map(i, 0, eqCount - 1, -1.2, 1.2) + random(-0.12, 0.12);
                    let phi = HALF_PI + random(-0.25, 0.25);
                    stars.push({
                        pos: perturbedPoint(theta, phi, params.sphereRadius),
                        size: random(35, 48),
                        phase: random(TWO_PI)
                    });
                }
                for (let i = 0; i < params.starCount; i++) {
                    let theta = random(TWO_PI);
                    let phi = random(PI);
                    stars.push({
                        pos: perturbedPoint(theta, phi, params.sphereRadius),
                        size: random(12, 18),
                        phase: random(TWO_PI)
                    });
                }
                particles = [];
                for (let i = 0; i < params.particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function precomputeSpherePoints() {
                spherePoints = [];
                let latCount = params.gridDensity;
                let lonCount = params.gridDensity * 2;
                for (let i = 0; i <= latCount; i++) {
                    spherePoints[i] = [];
                    let phi = map(i, 0, latCount, 0.08, PI - 0.08);
                    for (let j = 0; j <= lonCount; j++) {
                        let theta = map(j, 0, lonCount, 0, TWO_PI);
                        spherePoints[i][j] = perturbedPoint(theta, phi, params.sphereRadius);
                    }
                }
            }

            function draw() {
                if (!isVisible) return;
                background(bgColor);
                time += params.rotationSpeed;
                let rotX = time * 0.7 + params.viewOffsetX;
                let rotY = time * 0.5;
                let rotZ = time * 0.3;
                drawSphereGrid(rotX, rotY, rotZ);
                drawStars(rotX, rotY, rotZ);
                for (let p of particles) {
                    p.update();
                    p.draw(rotX, rotY, rotZ);
                }
            }

            function sphericalToCartesian(r, theta, phi) {
                return {
                    x: r * sin(phi) * cos(theta),
                    y: r * sin(phi) * sin(theta),
                    z: r * cos(phi)
                };
            }

            function rotate3D(x, y, z, rx, ry, rz) {
                let y1 = y * cos(rx) - z * sin(rx);
                let z1 = y * sin(rx) + z * cos(rx);
                let x2 = x * cos(ry) + z1 * sin(ry);
                let z2 = -x * sin(ry) + z1 * cos(ry);
                let x3 = x2 * cos(rz) - y1 * sin(rz);
                let y3 = x2 * sin(rz) + y1 * cos(rz);
                return { x: x3, y: y3, z: z2 };
            }

            function project(x, y, z) {
                let scale = focalLength / (focalLength + z);
                return {
                    x: x * scale + width / 2,
                    y: y * scale + height / 2,
                    scale: scale,
                    visible: z > -focalLength + 50
                };
            }

            function perturbedPoint(theta, phi, r) {
                let base = sphericalToCartesian(r, theta, phi);
                let nx = base.x / r, ny = base.y / r, nz = base.z / r;
                let amp = params.noiseAmp;
                let n = noise(base.x * 0.004, base.y * 0.004, base.z * 0.004);
                let n2 = noise(base.x * 0.012 + 1000, base.y * 0.012 + 1000, base.z * 0.012 + 1000);
                let displacement = (n - 0.5) * amp + (n2 - 0.5) * amp * 0.4;
                return {
                    x: base.x + nx * displacement,
                    y: base.y + ny * displacement,
                    z: base.z + nz * displacement
                };
            }

            function drawSphereGrid(rotX, rotY, rotZ) {
                let latCount = params.gridDensity;
                let lonCount = params.gridDensity * 2;
                let c = color(primaryColor);
                c.setAlpha(120);
                stroke(c);
                strokeWeight(params.lineWeight);
                noFill();
                let projected = [];
                for (let i = 0; i <= latCount; i++) {
                    projected[i] = [];
                    for (let j = 0; j <= lonCount; j++) {
                        let p = spherePoints[i][j];
                        let rp = rotate3D(p.x, p.y, p.z, rotX, rotY, rotZ);
                        projected[i][j] = project(rp.x, rp.y, rp.z);
                    }
                }
                for (let i = 1; i < latCount; i++) {
                    beginShape();
                    for (let j = 0; j <= lonCount; j++) {
                        let pt = projected[i][j];
                        if (pt.visible) vertex(pt.x, pt.y);
                    }
                    endShape();
                }
                for (let j = 0; j <= lonCount; j++) {
                    beginShape();
                    for (let i = 0; i <= latCount; i++) {
                        let pt = projected[i][j];
                        if (pt.visible) vertex(pt.x, pt.y);
                    }
                    endShape();
                }
            }

            function drawStars(rotX, rotY, rotZ) {
                let c = color(primaryColor);
                for (let s of stars) {
                    let rp = rotate3D(s.pos.x, s.pos.y, s.pos.z, rotX, rotY, rotZ);
                    let proj = project(rp.x, rp.y, rp.z);
                    if (!proj.visible) continue;
                    let pulse = 0.6 + 0.4 * sin(time * 2 + s.phase);
                    let alpha = 230 * pulse + 20;
                    let size = s.size * proj.scale;
                    let x = proj.x, y = proj.y;
                    noStroke();
                    // outer glow
                    c.setAlpha(alpha * 0.15);
                    fill(c);
                    ellipse(x, y, size * 4.0, size * 4.0);
                    // middle glow
                    c.setAlpha(alpha * 0.4);
                    fill(c);
                    ellipse(x, y, size * 2.2, size * 2.2);
                    // main dot
                    c.setAlpha(alpha * 0.8);
                    fill(c);
                    ellipse(x, y, size, size);
                    // bright core
                    c.setAlpha(alpha);
                    fill(c);
                    ellipse(x, y, size * 0.45, size * 0.45);
                    // cross rays
                    c.setAlpha(alpha * 0.4);
                    stroke(c);
                    strokeWeight(params.lineWeight * 0.8);
                    line(x - size * 1.2, y, x + size * 1.2, y);
                    line(x, y - size * 1.2, x, y + size * 1.2);
                    noStroke();
                }
            }

            class Particle {
                constructor() {
                    this.theta = random(TWO_PI);
                    this.phi = random(0.2, PI - 0.2);
                    this.speedTheta = random(-0.0008, 0.0008);
                    this.speedPhi = random(-0.0003, 0.0003);
                    this.trail = [];
                    this.r = params.sphereRadius * random(0.97, 1.03);
                }
                update() {
                    this.theta += this.speedTheta;
                    this.phi += this.speedPhi;
                    this.phi = constrain(this.phi, 0.15, PI - 0.15);
                    let p = perturbedPoint(this.theta, this.phi, this.r);
                    this.trail.push({ x: p.x, y: p.y, z: p.z });
                    if (this.trail.length > params.trailLength) this.trail.shift();
                }
                draw(rotX, rotY, rotZ) {
                    if (this.trail.length < 2) return;
                    let c = color(secondaryColor);
                    for (let i = 0; i < this.trail.length - 1; i++) {
                        let rp1 = rotate3D(this.trail[i].x, this.trail[i].y, this.trail[i].z, rotX, rotY, rotZ);
                        let proj1 = project(rp1.x, rp1.y, rp1.z);
                        if (!proj1.visible) continue;
                        let rp2 = rotate3D(this.trail[i+1].x, this.trail[i+1].y, this.trail[i+1].z, rotX, rotY, rotZ);
                        let proj2 = project(rp2.x, rp2.y, rp2.z);
                        if (!proj2.visible) continue;
                        let alpha = map(i, 0, this.trail.length, 0, 55);
                        c.setAlpha(alpha);
                        stroke(c);
                        strokeWeight(params.lineWeight * 0.5 * proj1.scale);
                        line(proj1.x, proj1.y, proj2.x, proj2.y);
                    }
                }
            }

            function updateVisibility() {
                isVisible = (document.body.getAttribute('data-bg') || 'geo') === 'geo';
            }
            const observer = new MutationObserver(updateVisibility);
            observer.observe(document.body, { attributes: true, attributeFilter: ['data-bg'] });
            updateVisibility();
            window.setup = setup;
            window.draw = draw;
        })();
    </script>

    <div class="control-bar">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <h1 class="font-serif text-lg md:text-xl font-bold tracking-tight truncate">物理综合混合刷题</h1>
                <span id="mode-badge" class="font-mono text-xs px-2.5 py-1 rounded-full border shrink-0" style="border-color:var(--border-color);color:var(--muted-color);background:rgba(255,255,255,0.6)">顺序</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="font-btn" class="theme-chip hidden sm:inline-flex">字体：宋体</button>
                <button id="bg-btn" class="theme-chip hidden sm:inline-flex">背景：几何</button>
                <button id="order-btn" class="theme-chip">切换随机</button>
            </div>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="app" class="max-w-7xl mx-auto px-4 md:px-6 py-6 grid grid-cols-1 lg:grid-cols-[1fr_17rem] gap-6">

            <div id="quiz-view" class="geo-card p-6 md:p-8">
                <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-3 mb-6">

                        <div class="flex items-center gap-2 mb-1">
                            <h2 class="font-serif text-2xl font-bold" id="question-header">综合</h2>
                            <span id="question-meta" class="font-mono text-xs px-2 py-0.5 rounded-md border" style="border-color:var(--border-color);color:var(--muted-color)"></span>

                </div>
                <div id="navbar-container" class="grid grid-cols-5 gap-2"></div>
                <div class="mt-5">
                    <button id="sidebar-finish-btn" class="geo-primary w-full py-2.5 text-sm font-medium">完成练习</button>

                <div class="mt-4 space-y-2 text-xs" style="color:var(--muted-color)">

                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm" style="background:var(--correct-bg);border:1px solid var(--correct-border)"></span> 正确</div>

        <div id="bottom-navbar-container" class="flex items-center gap-2 overflow-x-auto whitespace-nowrap custom-scrollbar"></div>

            const BG_MODES = ['geo', 'plain'];
            const BG_LABELS = { geo: '几何', plain: '素白' };

            function init() {
                state.allQuestions = questionBankData;
                resetOrder();
                state.userAnswers = new Array(state.allQuestions.length).fill(null);
                loadBg();
                loadFont();
                renderQuestion();
                renderNavbar();
                updateProgress();
                prevBtn.addEventListener('click', showPrev);
                nextBtn.addEventListener('click', showNext);
                finishBtn.addEventListener('click', showResults);
                sidebarFinishBtn.addEventListener('click', showResults);
                orderBtn.addEventListener('click', toggleOrder);
                restartBtn.addEventListener('click', restartQuiz);
                fontBtn.addEventListener('click', toggleFont);
                bgBtn.addEventListener('click', toggleBg);
            }

            function resetOrder() {
                state.order = state.allQuestions.map((_, i) => i);
                if (state.mode === 'random') {
                    state.order = shuffleArray(state.order, state.seed);
                }
            }

            function questionAt(i) {
                return state.allQuestions[state.order[i]];
            }

            function answerAt(i) {
                return state.userAnswers[state.order[i]];
            }

            function setAnswerAt(i, value) {
                state.userAnswers[state.order[i]] = value;
            }

            function typeLabel(type) {
                if (type === 'multipleChoice') return '选择题';
                if (type === 'fillInTheBlank') return '填空题';
                return '解答题';
            }

            function renderQuestion() {
                if (state.allQuestions.length === 0) {
                    questionBody.innerHTML = '<p>题库为空。</p>';
                    return;
                }
                const question = questionAt(state.currentIndex);
                questionHeader.textContent = question.category || '综合';
                questionMeta.textContent = typeLabel(question.type);
                questionCounter.textContent = `第 ${state.currentIndex + 1} / ${state.order.length} 题`;
                questionBody.innerHTML = question.question.replace(/\n/g, '<br>');

                if (question.image) {
                    const figure = document.createElement('div');
                    figure.className = 'question-figure';
                    const img = document.createElement('img');
                    img.src = question.image;
                    img.alt = '题图';
                    figure.appendChild(img);
                    questionBody.appendChild(figure);
                }

                answerArea.innerHTML = '';

                if (question.type === 'multipleChoice') renderMultipleChoice(question);
                else if (question.type === 'fillInTheBlank') renderFillIn(question, false);
                else renderFillIn(question, true);

                prevBtn.disabled = state.currentIndex === 0;
                nextBtn.disabled = state.currentIndex === state.order.length - 1;

                if (window.MathJax) MathJax.typesetPromise([questionBody, answerArea]);
            }

            function renderMultipleChoice(question) {
                const optionLetters = ['A', 'B', 'C', 'D', 'E'];
                question.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn geo-btn';
                    btn.innerHTML = `<span class="font-mono font-bold mr-2">${optionLetters[index]}.</span>${option}`;
                    btn.onclick = () => handleMC(index, optionLetters[index], btn);
                    answerArea.appendChild(btn);
                });
                const stored = answerAt(state.currentIndex);
                if (stored) restoreMC(stored.selected);
            }

            function handleMC(index, letter, btn) {
                if (answerAt(state.currentIndex)) return;
                const question = questionAt(state.currentIndex);
                const isCorrect = letter === question.answer;
                setAnswerAt(state.currentIndex, { selected: letter, isCorrect });
                applyMCStyles(letter, question.answer);
                updateNavbar();
                updateProgress();
            }

            function restoreMC(selected) {
                applyMCStyles(selected, questionAt(state.currentIndex).answer);
            }

            function applyMCStyles(selected, correct) {
                const buttons = answerArea.querySelectorAll('.option-btn');
                buttons.forEach((btn, idx) => {
                    const letter = ['A', 'B', 'C', 'D', 'E'][idx];
                    btn.disabled = true;
                    btn.classList.remove('correct', 'wrong');
                    if (letter === correct) btn.classList.add('correct');
                    else if (letter === selected) btn.classList.add('wrong');
                });
            }

            function renderFillIn(question, isLong) {
                const container = document.createElement('div');
                container.className = 'flex flex-col gap-3';

                const input = document.createElement(isLong ? 'textarea' : 'input');
                input.type = isLong ? null : 'text';
                input.id = 'text-answer-input';
                input.className = 'w-full p-3 outline-none';
                input.style.color = 'var(--text-color)';
                input.placeholder = isLong ? '请输入答案/关键结果（多部分用 ; 分隔）' : '请输入答案...';
                if (isLong) { input.rows = 4; }

                const submitBtn = document.createElement('button');
                submitBtn.textContent = '提交答案';
                submitBtn.className = 'geo-primary px-5 py-2 self-start';
                submitBtn.onclick = () => handleTextSubmit();

                container.appendChild(input);
                container.appendChild(submitBtn);
                answerArea.appendChild(container);

                input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !isLong) handleTextSubmit(); });

                const stored = answerAt(state.currentIndex);
                if (stored) restoreText(stored.selected);
            }

            function handleTextSubmit() {
                if (answerAt(state.currentIndex)) return;
                const input = document.getElementById('text-answer-input');
                const userAnswer = input.value.trim();
                if (userAnswer === '') return;
                const question = questionAt(state.currentIndex);
                const isCorrect = normalizeAnswer(userAnswer) === normalizeAnswer(question.answer);
                setAnswerAt(state.currentIndex, { selected: userAnswer, isCorrect });
                applyTextStyles(isCorrect, question);
                updateNavbar();
                updateProgress();
            }

            function restoreText(selected) {
                const input = document.getElementById('text-answer-input');
                input.value = selected;
                applyTextStyles(answerAt(state.currentIndex).isCorrect, questionAt(state.currentIndex));
            }

            function applyTextStyles(isCorrect, question) {
                const input = document.getElementById('text-answer-input');
                input.disabled = true;
                input.classList.add(isCorrect ? 'correct' : 'wrong');
                const submitBtn = input.nextElementSibling;
                if (submitBtn) submitBtn.disabled = true;

                const existing = answerArea.querySelector('.feedback');
                if (existing) existing.remove();

                const fb = document.createElement('div');
                fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
                if (isCorrect) {
                    fb.innerHTML = '<strong>回答正确</strong>';
                } else {
                    fb.innerHTML = '<strong>正确答案：</strong>' + question.answer +
                        (question.solution ? '<div class="mt-2"><strong>解析：</strong>' + question.solution + '</div>' : '');
                }
                answerArea.appendChild(fb);
                if (window.MathJax) MathJax.typesetPromise([fb]);
            }

            function renderNavbar() {
                navbarContainer.innerHTML = '';
                bottomNavbarContainer.innerHTML = '';
                state.order.forEach((origIdx, displayIdx) => {
                    const sidebarBtn = createNavButton(displayIdx);
                    navbarContainer.appendChild(sidebarBtn);
                    const bottomBtn = createNavButton(displayIdx);
                    bottomNavbarContainer.appendChild(bottomBtn);
                });
                updateNavbar();
            }

            function createNavButton(displayIdx) {
                const btn = document.createElement('button');
                btn.textContent = displayIdx + 1;
                btn.className = 'nav-btn';
                btn.dataset.idx = displayIdx;
                btn.onclick = () => goToQuestion(displayIdx);
                return btn;
            }

            function updateNavbar() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const idx = parseInt(btn.dataset.idx, 10);
                    btn.classList.remove('current', 'correct', 'wrong');
                    const answer = answerAt(idx);
                    if (idx === state.currentIndex) btn.classList.add('current');
                    else if (answer && answer.isCorrect) btn.classList.add('correct');
                    else if (answer) btn.classList.add('wrong');
                });
            }

            function goToQuestion(index) {
                if (index >= 0 && index < state.order.length) {
                    state.currentIndex = index;
                    renderQuestion();
                    updateNavbar();
                    const btn = navbarContainer.children[index];
                    if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }

            function showNext() { goToQuestion(state.currentIndex + 1); }
            function showPrev() { goToQuestion(state.currentIndex - 1); }

            function toggleOrder() {
                if (state.mode === 'sequential') {
                    state.mode = 'random';
                    state.seed = Date.now();
                    orderBtn.textContent = '切换顺序';
                    modeBadge.textContent = '随机';
                } else {
                    state.mode = 'sequential';
                    orderBtn.textContent = '切换随机';
                    modeBadge.textContent = '顺序';
                }
                resetOrder();
                state.currentIndex = 0;
                renderQuestion();
                renderNavbar();
            }

            function updateProgress() {
                const total = state.allQuestions.length;
                const answered = state.userAnswers.filter(a => a !== null).length;
                const pct = total > 0 ? (answered / total) * 100 : 0;
                progressFill.style.width = pct + '%';
                progressText.textContent = `${answered} / ${total}`;
            }

            function showResults() {
                const correct = state.userAnswers.filter(a => a && a.isCorrect).length;
                const total = state.allQuestions.length;
                const pct = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
                scoreText.innerHTML = `答对 <strong>${correct}</strong> / ${total} 题<br><span class="text-lg" style="color:var(--muted-color)">正确率 ${pct}%</span>`;
                quizView.classList.add('hidden');
                resultView.classList.remove('hidden');
            }

            function restartQuiz() {
                state.currentIndex = 0;
                state.userAnswers.fill(null);
                state.mode = 'sequential';
                orderBtn.textContent = '切换随机';
                modeBadge.textContent = '顺序';
                resetOrder();
                resultView.classList.add('hidden');
                quizView.classList.remove('hidden');
                renderQuestion();
                renderNavbar();
                updateProgress();
            }

            function loadFont() {
                const saved = localStorage.getItem('grind-font');
                const font = saved || 'serif';
                setFont(font);
            }

            function toggleFont() {
                const current = document.documentElement.style.getPropertyValue('--question-font').includes('sans') ? 'sans' : 'serif';
                const next = current === 'serif' ? 'sans' : 'serif';
                setFont(next);
            }

            function setFont(font) {
                const value = font === 'sans' ? 'var(--font-sans)' : 'var(--font-serif)';
                document.documentElement.style.setProperty('--question-font', value);
                fontBtn.textContent = font === 'sans' ? '字体：黑体' : '字体：宋体';
                localStorage.setItem('grind-font', font);
                if (window.MathJax) MathJax.typesetPromise();
            }

            function loadBg() {
                const saved = localStorage.getItem('grind-bg');
                const bg = BG_MODES.includes(saved) ? saved : 'geo';
                setBg(bg);
            }

            function toggleBg() {
                const current = document.body.getAttribute('data-bg') || 'geo';
                const idx = BG_MODES.indexOf(current);
                const next = BG_MODES[(idx + 1) % BG_MODES.length];
                setBg(next);
            }

            function setBg(bg) {
                document.body.setAttribute('data-bg', bg);
                bgBtn.textContent = '背景：' + (BG_LABELS[bg] || bg);
                localStorage.setItem('grind-bg', bg);
            }

            init();
        }

        if (window.MathJax && window.MathJax.startup) {
            window.MathJax.startup.promise.then(mainApp);
        } else {
            document.addEventListener('DOMContentLoaded', mainApp);
        }
    </script>
</body>
</html>
