name = "coursecore"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# ---- 环境变量 + 敏感密钥：统一用 wrangler pages secret 注入（Pages Functions 不读取 [vars]） ----
#   npx wrangler pages secret put SUPABASE_URL
#   npx wrangler pages secret put CONTENT_CACHE_TTL
#   npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
#   -> service_role key 只在函数内使用，绝不暴露给浏览器
#
# 注意：前端 VITE_*（如 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY）由 Vite 构建时
#       从 .env.local 读取并内联进 bundle，不要写进 wrangler.toml（[vars] 只对
#       pages dev 的 Functions 运行时生效，进不了前端 bundle）。
#
# ---- 可选：限流用的 KV 命名空间 ----
#   先创建：npx wrangler kv namespace create RATE_LIMIT_KV
#   再把下面三行取消注释，并把 id 换成真实值。
#   未配置时 rateLimit 中间件会自动跳过（已做降级），不影响运行。
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_YOUR_KV_ID"
