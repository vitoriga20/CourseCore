<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutalist Sphere — Generative Background</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 100vh;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '*';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .jump-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .jump-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--anthropic-light-gray);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 80px;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Brutalist Sphere</h1>
            <div class="subtitle">A high-contrast generative sphere: radial rays, orbital rings, and hard-cut inversions on black.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next</button>
                </div>
                <div class="jump-row">
                    <input type="number" id="jump-input" placeholder="jump to seed">
                    <button class="button tertiary" onclick="jumpToSeed()">Go</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Sphere Radius</label>
                    <div class="slider-container">
                        <input type="range" id="sphereRadius" min="400" max="2000" step="50" value="1200" oninput="updateParam('sphereRadius', this.value)">
                        <span class="value-display" id="sphereRadius-value">1200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Grid Density</label>
                    <div class="slider-container">
                        <input type="range" id="gridDensity" min="4" max="16" step="1" value="8" oninput="updateParam('gridDensity', this.value)">
                        <span class="value-display" id="gridDensity-value">8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Amplitude</label>
                    <div class="slider-container">
                        <input type="range" id="noiseAmp" min="0" max="40" step="1" value="12" oninput="updateParam('noiseAmp', this.value)">
                        <span class="value-display" id="noiseAmp-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Rotation Speed</label>
                    <div class="slider-container">
                        <input type="range" id="rotationSpeed" min="0" max="100" step="1" value="30" oninput="updateParam('rotationSpeed', this.value)">
                        <span class="value-display" id="rotationSpeed-value">0.0003</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Star Count</label>
                    <div class="slider-container">
                        <input type="range" id="starCount" min="0" max="48" step="1" value="16" oninput="updateParam('starCount', this.value)">
                        <span class="value-display" id="starCount-value">16</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Line Weight</label>
                    <div class="slider-container">
                        <input type="range" id="lineWeight" min="0.5" max="4" step="0.1" value="1.8" oninput="updateParam('lineWeight', this.value)">
                        <span class="value-display" id="lineWeight-value">1.8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Focal Length</label>
                    <div class="slider-container">
                        <input type="range" id="focalLength" min="800" max="2500" step="50" value="1500" oninput="updateParam('focalLength', this.value)">
                        <span class="value-display" id="focalLength-value">1500</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>View Offset X</label>
                    <div class="slider-container">
                        <input type="range" id="viewOffsetX" min="0" max="314" step="1" value="157" oninput="updateParam('viewOffsetX', this.value)">
                        <span class="value-display" id="viewOffsetX-value">1.57</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Ray Count</label>
                    <div class="slider-container">
                        <input type="range" id="rayCount" min="0" max="48" step="4" value="16" oninput="updateParam('rayCount', this.value)">
                        <span class="value-display" id="rayCount-value">16</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Ring Count</label>
                    <div class="slider-container">
                        <input type="range" id="ringCount" min="0" max="8" step="1" value="4" oninput="updateParam('ringCount', this.value)">
                        <span class="value-display" id="ringCount-value">4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Invert Interval</label>
                    <div class="slider-container">
                        <input type="range" id="invertInterval" min="0" max="300" step="10" value="150" oninput="updateParam('invertInterval', this.value)">
                        <span class="value-display" id="invertInterval-value">150</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Perspective Grid</label>
                    <div class="slider-container">
                        <input type="range" id="perspectiveGrid" min="0" max="1" step="1" value="1" oninput="updateParam('perspectiveGrid', this.value)">
                        <span class="value-display" id="perspectiveGrid-value">on</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Background</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#0a0a0a" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#0a0a0a</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Grid Ink</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#ffffff" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#ffffff</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Star Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#e6e6e6" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#e6e6e6</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Ray / Ring Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#808080" onchange="updateColor('color4', this.value)">
                        <span class="color-value" id="color4-value">#808080</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Shadow Tone</label>
                    <div class="color-picker-container">
                        <input type="color" id="color5" value="#2a2a2a" onchange="updateColor('color5', this.value)">
                        <span class="color-value" id="color5-value">#2a2a2a</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="initializeSystem()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="downloadPNG()" style="margin-top: 8px;">Download PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            sphereRadius: 1200,
            gridDensity: 8,
            noiseAmp: 12,
            rotationSpeed: 0.0003,
            starCount: 16,
            lineWeight: 1.8,
            focalLength: 1500,
            viewOffsetX: Math.PI / 2,
            rayCount: 16,
            ringCount: 4,
            invertInterval: 150,
            perspectiveGrid: 1,
            colorPalette: ['#0a0a0a', '#ffffff', '#e6e6e6', '#808080', '#2a2a2a']
        };

        const defaultParams = JSON.parse(JSON.stringify(params));

        const structuralParams = ['sphereRadius', 'gridDensity', 'noiseAmp', 'focalLength', 'viewOffsetX', 'ringCount'];

        let spherePoints = [];
        let meridianIndices = [];
        let parallelIndices = [];
        let stars = [];
        let rings = [];
        let canvas;
        let lastInvert = 0;
        let inverted = false;

        function setup() {
            canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            frameRate(30);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            precomputeSphere();
            precomputeStars();
            buildRings();
            lastInvert = 0;
            inverted = false;

            background(params.colorPalette[0]);
        }

        function buildRings() {
            rings = [];
            const maxR = width * 0.48;
            for (let i = 0; i < params.ringCount; i++) {
                const t = (i + 1) / (params.ringCount + 1);
                rings.push({
                    r: maxR * t,
                    speed: (random() > 0.5 ? 1 : -1) * (i + 1) * 0.4,
                    opacity: map(i, 0, params.ringCount - 1, 0.9, 0.35)
                });
            }
        }

        function precomputeSphere() {
            spherePoints = [];
            meridianIndices = [];
            parallelIndices = [];

            const R = params.sphereRadius;
            const nLon = params.gridDensity * 2;
            const nLat = params.gridDensity;

            for (let i = 0; i <= nLat; i++) {
                const lat = map(i, 0, nLat, -HALF_PI, HALF_PI);
                const row = [];
                for (let j = 0; j <= nLon; j++) {
                    const lon = map(j, 0, nLon, 0, TWO_PI);
                    const nx = noise(i * 0.3, j * 0.3, params.seed * 0.0001);
                    const ny = noise(i * 0.3 + 100, j * 0.3 + 100, params.seed * 0.0001);
                    const nz = noise(i * 0.3 + 200, j * 0.3 + 200, params.seed * 0.0001);
                    const perturb = params.noiseAmp;
                    const x = (R + (nx - 0.5) * perturb) * cos(lat) * cos(lon);
                    const y = (R + (ny - 0.5) * perturb) * cos(lat) * sin(lon);
                    const z = (R + (nz - 0.5) * perturb) * sin(lat);
                    spherePoints.push({x, y, z});
                    row.push(spherePoints.length - 1);
                }
                parallelIndices.push(row);
            }

            for (let j = 0; j <= nLon; j++) {
                const col = [];
                for (let i = 0; i <= nLat; i++) {
                    col.push(parallelIndices[i][j]);
                }
                meridianIndices.push(col);
            }
        }

        function precomputeStars() {
            stars = [];
            const R = params.sphereRadius;
            const nLon = params.gridDensity * 2;
            const nLat = params.gridDensity;
            const maxStars = params.starCount;

            const triOffsets = [
                {u: 0.25, v: 0.25},
                {u: 0.75, v: 0.25},
                {u: 0.50, v: 0.75}
            ];

            let count = 0;
            for (let i = 0; i < nLat && count < maxStars; i++) {
                for (let j = 0; j < nLon && count < maxStars; j++) {
                    for (let k = 0; k < triOffsets.length && count < maxStars; k++) {
                        const u = j + triOffsets[k].u;
                        const v = i + triOffsets[k].v;
                        const lat = map(v, 0, nLat, -HALF_PI, HALF_PI);
                        const lon = map(u, 0, nLon, 0, TWO_PI);
                        const nx = noise(v * 0.3 + 50, u * 0.3 + 50, params.seed * 0.0001);
                        const ny = noise(v * 0.3 + 150, u * 0.3 + 150, params.seed * 0.0001);
                        const nz = noise(v * 0.3 + 250, u * 0.3 + 250, params.seed * 0.0001);
                        const perturb = params.noiseAmp;
                        const x = (R + (nx - 0.5) * perturb) * cos(lat) * cos(lon);
                        const y = (R + (ny - 0.5) * perturb) * cos(lat) * sin(lon);
                        const z = (R + (nz - 0.5) * perturb) * sin(lat);
                        stars.push({x, y, z, size: random(10, 18) + (j % 3) * 3});
                        count++;
                    }
                }
            }
        }

        function rotatePoint(p, rx, ry) {
            let x = p.x, y = p.y, z = p.z;

            let y1 = y * cos(rx) - z * sin(rx);
            let z1 = y * sin(rx) + z * cos(rx);
            y = y1; z = z1;

            let x1 = x * cos(ry) - z * sin(ry);
            let z2 = x * sin(ry) + z * cos(ry);
            x = x1; z = z2;

            return {x, y, z};
        }

        function project(p) {
            const fl = params.focalLength;
            const scale = fl / (fl + p.z);
            return {
                x: width / 2 + p.x * scale,
                y: height / 2 + p.y * scale,
                scale: scale,
                z: p.z
            };
        }

        function draw() {
            const bg = color(params.colorPalette[0]);
            const ink = color(params.colorPalette[1]);
            const starCol = color(params.colorPalette[2]);
            const rayCol = color(params.colorPalette[3]);
            const shadow = color(params.colorPalette[4]);

            if (params.invertInterval > 0 && frameCount - lastInvert >= params.invertInterval) {
                inverted = !inverted;
                lastInvert = frameCount;
            }

            let drawBg = bg;
            let drawInk = ink;
            let drawStar = starCol;
            let drawRay = rayCol;
            if (inverted) {
                drawBg = color(255 - red(bg), 255 - green(bg), 255 - blue(bg));
                drawInk = color(255 - red(ink), 255 - green(ink), 255 - blue(ink));
                drawStar = color(255 - red(starCol), 255 - green(starCol), 255 - blue(starCol));
                drawRay = color(255 - red(rayCol), 255 - green(rayCol), 255 - blue(rayCol));
            }

            background(drawBg);

            const cx = width / 2;
            const cy = height / 2;
            const time = frameCount * params.rotationSpeed;
            const rotX = time * 0.7 + params.viewOffsetX;
            const rotY = time * 0.4;

            if (params.perspectiveGrid) {
                drawPerspectiveGrid(cx, cy, drawInk);
            }

            drawRadialRays(cx, cy, params.rayCount, width * 0.55, time * 0.5, drawRay);

            push();
            translate(cx, cy);

            noFill();
            strokeWeight(params.lineWeight);
            for (let i = 0; i < rings.length; i++) {
                const ring = rings[i];
                const rot = time * ring.speed;
                push();
                rotate(rot);
                const ringCol = color(red(drawRay), green(drawRay), blue(drawRay), ring.opacity * 255);
                stroke(ringCol);
                ellipse(0, 0, ring.r * 2, ring.r * 2);
                pop();
            }

            for (const row of parallelIndices) {
                let visible = false;
                beginShape();
                for (const idx of row) {
                    const rp = rotatePoint(spherePoints[idx], rotX, rotY);
                    if (rp.z > -params.focalLength * 0.7) visible = true;
                    const pj = project(rp);
                    const alpha = map(constrain(rp.z, -params.sphereRadius, params.sphereRadius), -params.sphereRadius, params.sphereRadius, 40, 220);
                    stroke(red(drawInk), green(drawInk), blue(drawInk), alpha);
                    vertex(pj.x - cx, pj.y - cy);
                }
                endShape();
            }

            for (const col of meridianIndices) {
                let visible = false;
                beginShape();
                for (const idx of col) {
                    const rp = rotatePoint(spherePoints[idx], rotX, rotY);
                    if (rp.z > -params.focalLength * 0.7) visible = true;
                    const pj = project(rp);
                    const alpha = map(constrain(rp.z, -params.sphereRadius, params.sphereRadius), -params.sphereRadius, params.sphereRadius, 40, 220);
                    stroke(red(drawInk), green(drawInk), blue(drawInk), alpha);
                    vertex(pj.x - cx, pj.y - cy);
                }
                endShape();
            }

            for (const s of stars) {
                const rp = rotatePoint(s, rotX, rotY);
                if (rp.z < -params.sphereRadius * 0.1) continue;
                const pj = project(rp);
                const alpha = map(constrain(rp.z, -params.sphereRadius * 0.2, params.sphereRadius), -params.sphereRadius * 0.2, params.sphereRadius, 80, 255);
                const size = s.size * pj.scale;
                drawCross(pj.x - cx, pj.y - cy, size, color(red(drawStar), green(drawStar), blue(drawStar), alpha));
            }

            drawCentralStar(0, 0, 28, drawInk);

            pop();

            if (inverted && frameCount - lastInvert > 8) {
                inverted = false;
            }
        }

        function drawPerspectiveGrid(cx, cy, c) {
            const horizon = height * 0.72;
            const focal = 340;
            let zMove = frameCount * 2;
            strokeWeight(params.lineWeight * 0.5);

            for (let z = 20; z < 4000; z += 80) {
                let depth = z + zMove;
                depth = depth % 4000;
                let y = horizon + focal * 140 / depth;
                let alpha = map(depth, 20, 4000, 160, 15);
                if (alpha < 0) alpha = 0;
                stroke(red(c), green(c), blue(c), alpha);
                line(0, y, width, y);
            }

            for (let x = -width; x <= width * 2; x += 100) {
                noFill();
                beginShape();
                for (let z = 20; z < 4000; z += 60) {
                    let depth = z + zMove;
                    depth = depth % 4000;
                    let y = horizon + focal * 140 / depth;
                    let sx = cx + (x - cx) * focal / depth;
                    let bend = 0.000015 * pow(x - cx, 2) * (depth / 1000);
                    vertex(sx, y - bend);
                }
                stroke(red(c), green(c), blue(c), 40);
                endShape();
            }
        }

        function drawRadialRays(cx, cy, n, r, rot, c) {
            if (n <= 0) return;
            push();
            translate(cx, cy);
            rotate(rot);
            strokeWeight(params.lineWeight * 0.6);
            for (let i = 0; i < n; i++) {
                const a = (i / n) * TWO_PI;
                const alpha = map(i % 3, 0, 2, 30, 110);
                stroke(red(c), green(c), blue(c), alpha);
                line(0, 0, cos(a) * r, sin(a) * r);
            }
            pop();
        }

        function drawCentralStar(x, y, size, c) {
            stroke(c);
            strokeWeight(params.lineWeight * 1.2);
            const r = size;
            line(x - r, y, x + r, y);
            line(x, y - r, x, y + r);
            line(x - r * 0.7, y - r * 0.7, x + r * 0.7, y + r * 0.7);
            line(x + r * 0.7, y - r * 0.7, x - r * 0.7, y + r * 0.7);
        }

        function drawCross(x, y, size, c) {
            stroke(c);
            strokeWeight(size * 0.16);
            const r = size * 0.5;
            line(x - r, y, x + r, y);
            line(x, y - r, x, y + r);
        }

        function updateParam(paramName, value) {
            const num = parseFloat(value);
            params[paramName] = num;

            if (paramName === 'rotationSpeed') {
                params.rotationSpeed = num / 100000;
                document.getElementById('rotationSpeed-value').textContent = params.rotationSpeed.toFixed(4);
            } else if (paramName === 'viewOffsetX') {
                params.viewOffsetX = num / 100;
                document.getElementById('viewOffsetX-value').textContent = params.viewOffsetX.toFixed(2);
            } else if (paramName === 'perspectiveGrid') {
                document.getElementById('perspectiveGrid-value').textContent = num ? 'on' : 'off';
            } else {
                document.getElementById(paramName + '-value').textContent = value;
            }

            if (structuralParams.includes(paramName)) {
                precomputeSphere();
                precomputeStars();
                buildRings();
            }
        }

        function updateColor(colorId, value) {
            const idx = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            const input = document.getElementById('seed-input');
            const newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function jumpToSeed() {
            const input = document.getElementById('jump-input');
            const newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                updateSeedDisplay();
                initializeSystem();
            }
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            document.getElementById('sphereRadius').value = params.sphereRadius;
            document.getElementById('sphereRadius-value').textContent = params.sphereRadius;
            document.getElementById('gridDensity').value = params.gridDensity;
            document.getElementById('gridDensity-value').textContent = params.gridDensity;
            document.getElementById('noiseAmp').value = params.noiseAmp;
            document.getElementById('noiseAmp-value').textContent = params.noiseAmp;
            document.getElementById('rotationSpeed').value = 30;
            document.getElementById('rotationSpeed-value').textContent = params.rotationSpeed.toFixed(4);
            document.getElementById('starCount').value = params.starCount;
            document.getElementById('starCount-value').textContent = params.starCount;
            document.getElementById('lineWeight').value = params.lineWeight;
            document.getElementById('lineWeight-value').textContent = params.lineWeight;
            document.getElementById('focalLength').value = params.focalLength;
            document.getElementById('focalLength-value').textContent = params.focalLength;
            document.getElementById('viewOffsetX').value = 157;
            document.getElementById('viewOffsetX-value').textContent = params.viewOffsetX.toFixed(2);
            document.getElementById('rayCount').value = params.rayCount;
            document.getElementById('rayCount-value').textContent = params.rayCount;
            document.getElementById('ringCount').value = params.ringCount;
            document.getElementById('ringCount-value').textContent = params.ringCount;
            document.getElementById('invertInterval').value = params.invertInterval;
            document.getElementById('invertInterval-value').textContent = params.invertInterval;
            document.getElementById('perspectiveGrid').value = params.perspectiveGrid;
            document.getElementById('perspectiveGrid-value').textContent = params.perspectiveGrid ? 'on' : 'off';

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            document.getElementById('color4').value = params.colorPalette[3];
            document.getElementById('color4-value').textContent = params.colorPalette[3];
            document.getElementById('color5').value = params.colorPalette[4];
            document.getElementById('color5-value').textContent = params.colorPalette[4];

            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas(canvas, 'brutalist-sphere-seed-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
