<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconstruct — HTML Reproduction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Bebas+Neue&family=Dancing+Script&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    :root {
      --bg-black: #000000;
      --bg-white: #ffffff;
      --bg-grid: #e6e6e6;
      --fg-white: #ffffff;
      --fg-black: #000000;
      --gray-mid: #808080;
      --gray-dark: #2a2a2a;
      --bpm: 146;
      --beat: 0.4109589s;
      --loop: 8.219s;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #stage { position: fixed; inset: 0; }
    .scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.02s; }
    .scene.active { opacity: 1; }

    .txt-display { font-family: 'Inter', 'Noto Sans SC', sans-serif; font-weight: 800; }
    .txt-tall { font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif; }
    .txt-hand { font-family: 'Dancing Script', cursive; }
    .txt-body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }

    #transition-layer { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
    .invert-flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: difference; }
    .invert-flash.on { animation: flashOn 0.10s steps(1) forwards; }
    @keyframes flashOn { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

    .flash-wipe { position: absolute; inset: 0; background: #fff; opacity: 0; }
    .flash-wipe.on { animation: flashWipe 0.18s steps(1) forwards; }
    @keyframes flashWipe { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

    .sweep-wipe { position: absolute; inset: 0; background: #fff; transform: translateX(-110%); }
    .sweep-wipe.on { animation: sweepLR 0.4s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
    @keyframes sweepLR { to { transform: translateX(110%); } }

    .tear-wipe { position: absolute; inset: 0; background: #fff; clip-path: inset(0 50% 0 50%); }
    .tear-wipe.on { animation: tearOpen 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes tearOpen { to { clip-path: inset(0 0 0 0); } }

    #controls { position: fixed; bottom: 16px; left: 16px; z-index: 200; display: flex; gap: 8px; }
    #controls button { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    #timecode { position: fixed; top: 16px; left: 16px; z-index: 200; color: rgba(255,255,255,0.5); font-family: 'Inter', monospace; font-size: 12px; }

    .scene-black { background: #000; }

    .scene-overdose { background: #000; }
    .od-capsule { position: absolute; left: 50%; top: 58%; width: 36vw; height: 12vh; border-radius: 999px; background: #fff; transform: translate(-50%, -50%) rotate(-18deg); }
    .od-star { position: absolute; left: 64%; top: 42%; width: 16vw; height: 16vw; background: #fff; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
    .od-card { position: absolute; left: 52%; top: 68%; padding: 8px 14px; background: #fff; color: #000; font-size: 12px; transform: rotate(6deg); }
    .od-title { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); font-size: 11vw; color: #fff; letter-spacing: -0.02em; white-space: nowrap; }
    .od-left { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); color: #fff; font-size: 1.2vw; writing-mode: vertical-rl; letter-spacing: 0.1em; }
    .od-small { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); color: rgba(255,255,255,0.6); font-size: 10px; letter-spacing: 0.2em; }
    .od-ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 42vw; height: 42vw; border: 1px solid rgba(255,255,255,0.25); border-radius: 50%; }

    .scene-disorderly { background: #fff; }
    .disorderly-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 48px 48px; transform-origin: 50% 100%; }
    .disorderly-plane { position: absolute; left: -20%; right: -20%; bottom: 0; height: 45%; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.04) 100%); transform: perspective(400px) rotateX(55deg); transform-origin: 50% 100%; }
    .disorderly-capsule { position: absolute; left: 50%; top: 54%; width: 38vw; height: 13vh; border-radius: 999px; background: #000; transform: translate(-50%, -50%) rotate(-12deg); }
    .disorderly-star { position: absolute; left: 62%; top: 44%; width: 18vw; height: 18vw; background: #000; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
    .disorderly-card { position: absolute; left: 52%; top: 66%; padding: 10px 18px; background: #000; color: #fff; font-size: 14px; transform: rotate(4deg); }
    .disorderly-title { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); font-size: 18vw; color: #000; letter-spacing: -0.04em; white-space: nowrap; }
    .disorderly-title .o-replace { display: inline-block; width: 0.8em; height: 0.35em; background: currentColor; border-radius: 999px; vertical-align: middle; margin: 0 0.02em; }
    .disorderly-left { position: absolute; left: 5%; top: 50%; transform: translateY(-50%); color: #000; font-size: 1.1vw; writing-mode: vertical-rl; letter-spacing: 0.08em; }
    .disorderly-dots { position: absolute; right: 8%; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
    .disorderly-dots span { width: 6px; height: 6px; border-radius: 50%; background: #000; }
    .disorderly-fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 10; }

    .scene-bird { background: #000; }
    .bird-stack { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) perspective(700px) rotateX(25deg); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .bird-chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); padding: 10px 28px; color: #fff; font-size: 13px; box-shadow: 0 24px 0 rgba(255,255,255,.08); }
    .bird-rays { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .bird-labels { position: absolute; right: 10%; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; color: rgba(255,255,255,0.45); font-size: 11px; text-align: right; }

    .scene-endless { background: #e6e6e6; }
    .endless-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: 40px 40px; }
    .endless-canvas { position: absolute; inset: 0; z-index: 1; }
    .endless-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 42vh; background: #000; z-index: 3; transform-origin: top; }
    .endless-text { position: absolute; left: 0; right: 0; bottom: 0; height: 42vh; display: flex; align-items: center; justify-content: center; z-index: 2; }
    .endless-text span { color: #000; font-size: 13vw; letter-spacing: -0.02em; }
    .endless-tags { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .endless-tag { position: absolute; background: #fff; color: #000; border: 1px solid #000; border-radius: 999px; padding: 4px 11px; font-size: 11px; letter-spacing: 0.01em; opacity: 0; }
    .endless-icons { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    .endless-icons span { position: absolute; color: #000; font-size: 14px; line-height: 1; opacity: 0; }

    .scene-consciousness { background: #000; }
    .consciousness-canvas { position: absolute; inset: 0; }
    .consciousness-top-labels { position: absolute; left: 0; right: 0; top: 12%; display: flex; justify-content: space-around; padding: 0 10%; color: rgba(255,255,255,0.7); font-size: 10px; letter-spacing: 0.12em; text-transform: lowercase; pointer-events: none; }
    .consciousness-label { position: absolute; left: 50%; top: 82%; transform: translate(-50%, -50%); color: #fff; font-size: 0.85vw; text-align: center; opacity: 0.7; }
    .consciousness-cn { display: block; color: #fff; font-size: 1.1vw; margin-top: 0.15em; }
    .consciousness-hill { position: absolute; left: -10%; right: -10%; bottom: 0; height: 34%; background: #0a0a0a; clip-path: polygon(0% 55%, 20% 40%, 45% 48%, 70% 35%, 100% 50%, 100% 100%, 0% 100%); }

    .scene-gridfloor { background: #000; }
    .gridfloor-canvas { position: absolute; inset: 0; }
    .gridfloor-labels { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); display: flex; gap: 30px; color: rgba(255,255,255,0.55); font-size: 11px; letter-spacing: 0.05em; }

    .scene-regularity { background: #000; }
    .regularity-canvas { position: absolute; inset: 0; }
    .regularity-text { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 2.2vw; text-align: center; }
    .sweep-bar { position: absolute; left: -50%; top: 0; bottom: 0; width: 40%; background: rgba(255,255,255,0.85); transform: skewX(-12deg); opacity: 0; }

    .scene-scripts { background: #000; }
    .scripts-bg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 27vw; color: rgba(255,255,255,0.55); white-space: nowrap; }
    .scripts-canvas { position: absolute; inset: 0; }
    .scripts-tags { position: absolute; inset: 0; pointer-events: none; }
    .scripts-tags span { position: absolute; color: rgba(255,255,255,0.80); font-size: 13px; }
    .scripts-tags span:nth-child(1) { left: 28%; top: 62%; }
    .scripts-tags span:nth-child(2) { left: 49%; top: 56%; }
    .scripts-tags span:nth-child(3) { left: 72%; top: 60%; }

    .scene-architectural { background: #fff; overflow: hidden; }
    .arch-panel-left { position: absolute; left: 0; top: 0; width: 50%; height: 100%; overflow: hidden; background: #888; }
    .arch-panel-right { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; background: #fff; overflow: hidden; }
    .arch-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .arch-star { position: absolute; inset: 0; overflow: hidden; }
    .arch-star-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .arch-overlay { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); text-align: center; color: #000; z-index: 5; mix-blend-mode: difference; }
    .arch-text { font-size: 3.4vw; letter-spacing: -0.02em; }
    .arch-sub { font-size: 1vw; margin-top: 0.5em; opacity: 0.85; }
    .arch-dots { display: flex; gap: 14px; justify-content: center; margin-top: 1.2em; }
    .arch-dots span { width: 8px; height: 8px; border-radius: 50%; background: #000; }
    .arch-dots span.empty { background: transparent; border: 1px solid #000; }
    .arch-assemble { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); font-size: 0.75vw; letter-spacing: 0.25em; text-transform: uppercase; color: #000; z-index: 5; mix-blend-mode: difference; }
    .arch-entrance { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0; }
    .arch-entrance-top { position: absolute; left: 50%; top: 0; width: 50%; height: 50%; background: #fff; }
    .arch-entrance-bottom { position: absolute; left: 0; top: 50%; width: 100%; height: 50%; background: rgba(0,0,0,0.82); }
    .arch-star { position: absolute; inset: 0; overflow: hidden; z-index: 4; }

    .scene-crusher { background: #000; }
    .crusher-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px); background-size: 32px 32px; }
    .crusher-side { position: absolute; top: 0; bottom: 0; width: 6vw; background: #fff; }
    .crusher-side.left { left: 0; }
    .crusher-side.right { right: 0; }
    .crusher-title { position: absolute; left: 8%; top: 40%; color: transparent; -webkit-text-stroke: 2px #fff; font-size: 11vw; }
    .crusher-sub { position: absolute; left: 8.5%; top: 54%; color: #fff; font-size: 2vw; }
    .crusher-label { position: absolute; left: 8%; top: 12%; color: rgba(255,255,255,0.5); font-size: 11px; letter-spacing: 0.05em; }
    .crusher-canvas { position: absolute; inset: 0; }
    .crusher-shards { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

    .scene-intertwine { background: #000; }
    .intertwine-grid { position: absolute; inset: -20%; background-image: linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px); background-size: 60px 60px; transform: rotate(24deg); }
    .intertwine-title { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); font-size: 12vw; color: #fff; letter-spacing: 0.08em; }
    .intertwine-sub { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 1.4vw; letter-spacing: 0.2em; text-transform: uppercase; }
    .intertwine-mandala { position: absolute; inset: 0; opacity: 0; }
    .intertwine-torus { position: absolute; inset: 0; opacity: 0; }
    .intertwine-canvas { position: absolute; inset: 0; }
    .intertwine-shards { position: absolute; inset: 0; pointer-events: none; z-index: 4; }

    .scene-torus { background: #080808; }
    .torus-canvas { position: absolute; inset: 0; }

    .scene-credits { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .credits-title { color: #fff; font-size: 7vw; margin-bottom: 4vh; }
    .credits-line { color: rgba(255,255,255,0.7); font-size: 1.2vw; margin: 0.4vh 0; }
    .credits-date { position: absolute; bottom: 8%; color: rgba(255,255,255,0.5); font-size: 0.9vw; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="transition-layer">
    <div class="invert-flash" id="invert-flash"></div>
    <div class="flash-wipe" id="flash-wipe"></div>
    <div class="sweep-wipe" id="sweep-wipe"></div>
    <div class="tear-wipe" id="tear-wipe"></div>
    <div class="sweep-bar" id="sweep-bar"></div>
  </div>
  <div id="timecode">0.00s</div>
  <div id="controls">
    <button id="btn-play">Pause</button>
    <button id="btn-restart">Restart</button>
    <button id="btn-slow">0.5x</button>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const scenes = [
      { id: 'black', start: 0.0, end: 0.533, build: buildBlack },
      { id: 'overdose', start: 0.533, end: 0.700, build: buildOverdose, render: renderOverdose },
      { id: 'disorderly', start: 0.700, end: 1.150, build: buildDisorderly, render: renderDisorderly },
      { id: 'bird', start: 1.150, end: 2.0, build: buildBird, render: renderBird },
      { id: 'endless', start: 2.0, end: 2.533, build: buildEndless, render: renderEndless },
      { id: 'consciousness', start: 2.533, end: 3.533, build: buildConsciousness, render: renderConsciousness },
      { id: 'regularity', start: 3.533, end: 4.0, build: buildRegularity, render: renderRegularity },
      { id: 'scripts', start: 4.0, end: 4.533, build: buildScripts, render: renderScripts },
      { id: 'architectural', start: 4.533, end: 5.400, build: buildArchitectural, render: renderArchitectural },
      { id: 'crusher', start: 5.400, end: 6.400, build: buildCrusher, render: renderCrusher },
      { id: 'intertwine', start: 6.533, end: 8.533, build: buildIntertwine, render: renderIntertwine },
    ];

    class SceneManager {
      constructor(scenes, stage) {
        this.scenes = scenes.sort((a, b) => a.start - b.start);
        this.stage = stage;
        this.scenes.forEach(s => {
          s.el = document.createElement('div');
          s.el.className = `scene scene-${s.id}`;
          if (s.build) s.build(s.el);
          stage.appendChild(s.el);
        });
      }
      update(t) {
        this.scenes.forEach(s => {
          const active = t >= s.start && t < s.end;
          s.el.classList.toggle('active', active);
          if (active && s.render) {
            const local = (t - s.start) / (s.end - s.start);
            s.render(s.el, clamp(local, 0, 1), t);
          }
        });
      }
    }

    function buildBlack(el) { el.classList.add('scene-black'); }

    function buildOverdose(el) {
      el.classList.add('scene-overdose');
      el.innerHTML = `
        <div class="od-ring"></div>
        <div class="od-capsule"></div>
        <div class="od-star"></div>
        <div class="od-card txt-body">Pile up</div>
        <div class="od-title txt-display">overdose</div>
        <div class="od-left txt-body">Meaningless accumulation</div>
        <div class="od-small txt-body">NEKOPAPER</div>
      `;
    }
    function renderOverdose(el, local) {
      const p = local;
      el.querySelector('.od-capsule').style.transform = `translate(calc(-50% + ${(1-p)*-120}px), calc(-50% + ${(1-p)*80}px)) rotate(${-18 + p*6}deg)`;
      el.querySelector('.od-star').style.transform = `translate(calc(-50% + ${(1-p)*160}px), calc(-50% + ${(1-p)*-60}px)) rotate(${p*90}deg)`;
      el.querySelector('.od-card').style.transform = `translate(calc(-50% + ${(1-p)*80}px), calc(-50% + ${(1-p)*120}px)) rotate(${6 - p*4}deg)`;
      el.querySelector('.od-title').style.opacity = p;
      el.querySelector('.od-left').style.opacity = p;
    }

    function buildDisorderly(el) {
      el.classList.add('scene-disorderly');
      el.innerHTML = `
        <div class="disorderly-grid"></div>
        <div class="disorderly-plane"></div>
        <div class="disorderly-capsule"></div>
        <div class="disorderly-star"></div>
        <div class="disorderly-card txt-body">Pile up</div>
        <div class="disorderly-title txt-display">Dis<span class="o-replace"></span>rderly</div>
        <div class="disorderly-left txt-body">Meaningless accumulation</div>
        <div class="disorderly-dots"><span></span><span></span><span></span></div>
        <div class="disorderly-fade"></div>
      `;
    }
    function renderDisorderly(el, local) {
      const rot = local * 8;
      el.querySelector('.disorderly-grid').style.transform = `perspective(600px) rotateX(${55 - rot}deg) rotateZ(${-local*3}deg)`;
      el.querySelector('.disorderly-capsule').style.transform = `translate(-50%, -50%) rotate(${-12 + local*8}deg)`;
      el.querySelector('.disorderly-star').style.transform = `translate(-50%, -50%) rotate(${local*120}deg)`;
      // exit fade-to-black: white disorderly field darkens toward the next black scene
      const fade = local > 0.75 ? Math.min(1, (local - 0.75) / 0.25) : 0;
      el.querySelector('.disorderly-fade').style.opacity = fade;
    }

    function buildBird(el) {
      el.classList.add('scene-bird');
      el.innerHTML = `
        <canvas class="bird-rays"></canvas>
        <div class="bird-stack">
          <div class="bird-chip txt-body">bird</div>
          <div class="bird-chip txt-body">Plane formation</div>
          <div class="bird-chip txt-body">latent</div>
          <div class="bird-chip txt-body">efficient</div>
          <div class="bird-chip txt-body">Diffusion synthesis</div>
          <div class="bird-chip txt-body">interface</div>
        </div>
        <div class="bird-labels txt-body">
          <span>Vague outline</span><span>skeleton</span><span>mirror</span>
        </div>
      `;
      drawBirdRays(el.querySelector('.bird-rays'));
    }
    function drawBirdRays(canvas) {
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = W(); canvas.height = H(); }
      resize(); window.addEventListener('resize', resize);
      canvas._draw = () => {
        ctx.clearRect(0, 0, W(), H());
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1;
        const cx = W() * 0.30, cy = H() * 0.5;
        for (let i = 0; i < 28; i++) {
          const a = -Math.PI / 3 + (i / 27) * (Math.PI / 1.5);
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(a) * W(), cy + Math.sin(a) * H());
          ctx.stroke();
        }
      };
    }
    function renderBird(el, local) {
      const stack = el.querySelector('.bird-stack');
      stack.style.transform = `translate(-50%, calc(-50% + ${local * -60}px)) perspective(700px) rotateX(25deg)`;
      if (el.querySelector('.bird-rays')._draw) el.querySelector('.bird-rays')._draw();
    }

    function buildEndless(el) {
      el.classList.add('scene-endless');
      el.innerHTML = `
        <div class="endless-grid"></div>
        <canvas class="endless-canvas"></canvas>
        <div class="endless-tags">
          <span class="endless-tag txt-body" style="left:26%; top:40%; background:#000; color:#fff; border-color:#000;">Run out of imagination</span>
          <span class="endless-tag txt-body" style="left:43%; top:34%;">words</span>
          <span class="endless-tag txt-body" style="left:51%; top:41%;">cosmic</span>
          <span class="endless-tag txt-body" style="left:39%; top:53%;">hollow</span>
        </div>
        <div class="endless-icons txt-body">
          <span style="left:52%; top:49%;">&#9825;</span>
          <span style="left:56%; top:49%;">&#9675;</span>
          <span style="left:60%; top:49%;">&#9651;</span>
          <span style="left:56%; top:55%;">&#9638;</span>
        </div>
        <div class="endless-text"><span class="txt-display">endless</span></div>
        <div class="endless-bar"></div>
      `;
      initEndlessCanvas(el.querySelector('.endless-canvas'));
    }
    function initEndlessCanvas(canvas) {
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = W(); canvas.height = H(); }
      resize(); window.addEventListener('resize', resize);
      canvas._draw = (local) => {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        const u = Math.min(w, h);
        const rot = local * 10;

        <div class="intertwine-torus"></div>
        <canvas class="intertwine-shards"></canvas>
      `;
      initMandalaCanvas(el.querySelector('.intertwine-canvas'));
      buildTorus(el.querySelector('.intertwine-torus'));
      initIntertwineShards(el.querySelector('.intertwine-shards'));
    }
    function initIntertwineShards(canvas) {
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = W(); canvas.height = H(); }
      resize(); window.addEventListener('resize', resize);
      canvas._draw = (local) => {
        const w = W(), h = H();
        ctx.clearRect(0, 0, w, h);
        if (local >= 0.10) return;
        const sub = local / 0.10;
        // big white shards sweep from crusher scene into the grid
        ctx.save();
        const shards = [
          {x: 0.18, y: 0.35, s: 0.22, a: 0.55, v: -1.4},
          {x: 0.72, y: 0.62, s: 0.16, a: -0.45, v: 1.1},
          {x: 0.55, y: 0.22, s: 0.12, a: 0.25, v: -0.8},
        ];
        shards.forEach((sh, i) => {
          const cx = w * (sh.x + sh.v * sub * 0.35);
          const cy = h * (sh.y + (i % 2 === 0 ? -1 : 1) * sub * 0.15);
          const s = Math.min(w, h) * sh.s * (1 + sub * 0.2);
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(sh.a + sub * (i % 2 === 0 ? 0.4 : -0.4));
          ctx.fillStyle = '#fff';
          ctx.globalAlpha = 0.55 * (1 - sub);
          ctx.beginPath();
          ctx.moveTo(-s * 0.35, -s * 0.55);
          ctx.lineTo(s * 0.45, -s * 0.25);
          ctx.lineTo(s * 0.25, s * 0.55);
          ctx.lineTo(-s * 0.55, s * 0.15);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });
        ctx.restore();
      };
    }
    function renderIntertwine(el, local, t) {
      const grid = el.querySelector('.intertwine-grid');
      const title = el.querySelector('.intertwine-title');
      const sub = el.querySelector('.intertwine-sub');
      const mandala = el.querySelector('.intertwine-mandala');
      const torusLayer = el.querySelector('.intertwine-torus');
      const shards = el.querySelector('.intertwine-shards');
      title.style.opacity = 1;
      title.style.transform = 'translate(-50%, -50%)';
      sub.style.opacity = 1;
      shards._draw(local);
      if (local < 0.10) {
        const subLocal = local / 0.10;
        grid.style.opacity = subLocal;
        mandala.style.opacity = 0;
        torusLayer.style.opacity = 0;
        grid.style.backgroundPosition = `${-subLocal * 180}px ${-subLocal * 180}px`;
      } else if (local < 0.25) {
        const subLocal = local / 0.25;
        grid.style.opacity = 1;
        mandala.style.opacity = 0;
        torusLayer.style.opacity = 0;
        grid.style.backgroundPosition = `${-subLocal * 180}px ${-subLocal * 180}px`;
      } else if (local < 0.45) {
        const subLocal = (local - 0.25) / 0.20;
        grid.style.opacity = 1 - subLocal;
        mandala.style.opacity = subLocal;
        torusLayer.style.opacity = 0;
        el.querySelector('.intertwine-canvas')._draw(t);
      } else {
        const subLocal = (local - 0.45) / 0.55;
        grid.style.opacity = 0;
        mandala.style.opacity = Math.max(0, 1 - subLocal * 1.5);
        torusLayer.style.opacity = subLocal;
        if (torusLayer._setT) torusLayer._setT(subLocal);
      }
    }

    function buildTorus(container) {
      container.classList.add('scene-torus');
      let seekT = 0;
      const p = new p5(function(sketch) {
        sketch.setup = function() {
          const c = sketch.createCanvas(W(), H(), sketch.WEBGL);
          c.elt.className = 'torus-canvas';
          sketch.noLoop();
          sketch.angleMode(sketch.DEGREES);
        };
        sketch.draw = function() {
          const t = seekT;
          sketch.background(8);
          sketch.ambientLight(60);
          sketch.pointLight(255, 255, 255, 300, -400, 400);
          sketch.camera(0, 0, 700, 0, 0, 0, 0, 1, 0);
          sketch.rotateX(45 + t * 15);
          sketch.rotateY(t * 90);
          sketch.noStroke();
          sketch.fill(55);
          sketch.torus(220, 75, 64, 32);
          sketch.stroke(200);
          sketch.strokeWeight(1.5);
          sketch.noFill();
          for (let i = 0; i < 6; i++) {
            sketch.push();
            sketch.rotateY(t * 140 + i * 60);
            sketch.rotateX(t * 70);
            sketch.translate(300, 0, 0);
            sketch.sphere(18, 16, 12);
            sketch.pop();
          }
        };
      }, container);
      container._setT = (tt) => { seekT = tt; p.redraw(); };
    }

    function buildCredits() {
      const el = document.createElement('div');
      el.className = 'scene scene-credits';
      el.innerHTML = `
        <div class="credits-title txt-hand">"Reconstruct"</div>
        <div class="credits-line txt-body">Music / Rainych - Overdose</div>
        <div class="credits-line txt-body">Video / NEKOPAPER</div>
        <div class="credits-date txt-body">October 11, 2023</div>
      `;
      return el;
    }

    const manager = new SceneManager(scenes, $('#stage'));
    window.manager = manager;
    const creditsEl = buildCredits();
    $('#stage').appendChild(creditsEl);

    let startTime = performance.now();
    let playing = true;
    let speed = 1;
    const totalDuration = 18.6;
    const loopStart = 8.533;
    const loopEnd = 16.533;

    // 第二段（loop）场景区间不再简单取模，而是按视频实际切点独立映射回第一段对应场景
    const secondVerseSegments = [
      { id: 'overdose',      start: 8.533, end: 8.792, targetStart: 0.533, targetEnd: 0.700 },
      { id: 'disorderly',    start: 8.792, end: 9.250, targetStart: 0.700, targetEnd: 1.150 },
      { id: 'bird',          start: 9.250, end: 9.875, targetStart: 1.150, targetEnd: 2.000 },
      { id: 'endless',       start: 9.875, end: 10.417, targetStart: 2.000, targetEnd: 2.533 },
      { id: 'consciousness', start: 10.417, end: 10.850, targetStart: 2.533, targetEnd: 3.000 },
      { id: 'consciousness', start: 10.850, end: 11.400, targetStart: 3.000, targetEnd: 3.533 },
      { id: 'regularity',    start: 11.400, end: 11.970, targetStart: 3.533, targetEnd: 4.000 },
      { id: 'scripts',       start: 11.970, end: 12.850, targetStart: 4.000, targetEnd: 4.533 },
      { id: 'architectural', start: 12.850, end: 13.450, targetStart: 4.533, targetEnd: 5.400 },
      { id: 'crusher',       start: 13.450, end: 14.450, targetStart: 5.400, targetEnd: 6.400 },
      { id: 'intertwine',    start: 14.450, end: 16.533, targetStart: 6.533, targetEnd: 8.533 },
    ];
    function mapRawToSceneTime(raw) {
      if (raw < loopStart || raw >= loopEnd) return raw;
      const seg = secondVerseSegments.find(s => raw >= s.start && raw < s.end);
      if (!seg) return raw;
      const local = (raw - seg.start) / (seg.end - seg.start);
      return seg.targetStart + local * (seg.targetEnd - seg.targetStart);
    }

    window.seekVideo = (t) => {
      startTime = performance.now() - t * 1000 / speed;
      let raw = t;
      let lt = mapRawToSceneTime(raw);
      if (raw >= totalDuration) lt = totalDuration;
      window.inLoop = raw >= loopStart && raw < loopEnd;
      manager.update(lt);
      creditsEl.classList.toggle('active', raw >= loopEnd);
      if (creditsEl.classList.contains('active')) {
        const cLocal = clamp((totalDuration - raw) / 2, 0, 1);
        creditsEl.style.opacity = 1 - cLocal;
      } else {
        creditsEl.style.opacity = 0;
      }
      $('#timecode').textContent = lt.toFixed(2) + 's';
    };
    window.pauseVideo = () => { playing = false; $('#btn-play').textContent = 'Play'; };

    function tick(now) {
      if (!playing) { requestAnimationFrame(tick); return; }
      let raw = (now - startTime) / 1000 * speed;
      let t = mapRawToSceneTime(raw);
      if (raw >= totalDuration) { t = totalDuration; playing = false; }

      window.inLoop = raw >= loopStart && raw < loopEnd;
      manager.update(t);
      creditsEl.classList.toggle('active', raw >= loopEnd);
      if (creditsEl.classList.contains('active')) {
        const cLocal = clamp((totalDuration - raw) / 2, 0, 1);
        creditsEl.style.opacity = 1 - cLocal;
      } else {
        creditsEl.style.opacity = 0;
      }

      if (t >= 1.0 && t < 1.08 && !window._flash1) { window._flash1 = true; $('#flash-wipe').classList.add('on'); setTimeout(() => $('#flash-wipe').classList.remove('on'), 200); }
      if (t >= 1.15) window._flash1 = false;

      if (t >= 4.5 && t < 4.65 && !window._tear) { window._tear = true; $('#tear-wipe').classList.add('on'); setTimeout(() => $('#tear-wipe').classList.remove('on'), 600); }
      if (t >= 4.8) window._tear = false;

      $('#timecode').textContent = t.toFixed(2) + 's';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    $('#btn-play').onclick = () => { playing = !playing; $('#btn-play').textContent = playing ? 'Pause' : 'Play'; };
    $('#btn-restart').onclick = () => { startTime = performance.now(); playing = true; $('#btn-play').textContent = 'Pause'; };
    $('#btn-slow').onclick = () => { speed = speed === 1 ? 0.5 : 1; $('#btn-slow').textContent = speed === 1 ? '0.5x' : '1x'; };

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      playing = false; $('#btn-play').textContent = 'Play';
    }
  </script>
</body>
