<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Brutalism — Generative Background</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 100vh;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '*';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .jump-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .jump-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--anthropic-light-gray);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 80px;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Radial Brutalism</h1>
            <div class="subtitle">A high-contrast mandala machine: concentric rings, radial rays, blade stars, and hard-cut inversions on black.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next</button>
                </div>
                <div class="jump-row">
                    <input type="number" id="jump-input" placeholder="jump to seed">
                    <button class="button tertiary" onclick="jumpToSeed()">Go</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Ring Count</label>
                    <div class="slider-container">
                        <input type="range" id="ringCount" min="2" max="8" step="1" value="5" oninput="updateParam('ringCount', this.value)">
                        <span class="value-display" id="ringCount-value">5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Ray Count</label>
                    <div class="slider-container">
                        <input type="range" id="rayCount" min="8" max="48" step="4" value="24" oninput="updateParam('rayCount', this.value)">
                        <span class="value-display" id="rayCount-value">24</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Star Blades</label>
                    <div class="slider-container">
                        <input type="range" id="starBlades" min="4" max="24" step="2" value="12" oninput="updateParam('starBlades', this.value)">
                        <span class="value-display" id="starBlades-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Rotation Speed</label>
                    <div class="slider-container">
                        <input type="range" id="rotationSpeed" min="0" max="100" step="1" value="25" oninput="updateParam('rotationSpeed', this.value)">
                        <span class="value-display" id="rotationSpeed-value">0.0025</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Fragment Density</label>
                    <div class="slider-container">
                        <input type="range" id="fragmentDensity" min="0" max="60" step="1" value="24" oninput="updateParam('fragmentDensity', this.value)">
                        <span class="value-display" id="fragmentDensity-value">24</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Invert Interval</label>
                    <div class="slider-container">
                        <input type="range" id="invertInterval" min="0" max="300" step="10" value="120" oninput="updateParam('invertInterval', this.value)">
                        <span class="value-display" id="invertInterval-value">120</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Line Weight</label>
                    <div class="slider-container">
                        <input type="range" id="lineWeight" min="0.5" max="4" step="0.1" value="1.5" oninput="updateParam('lineWeight', this.value)">
                        <span class="value-display" id="lineWeight-value">1.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Perspective Grid</label>
                    <div class="slider-container">
                        <input type="range" id="perspectiveGrid" min="0" max="1" step="1" value="1" oninput="updateParam('perspectiveGrid', this.value)">
                        <span class="value-display" id="perspectiveGrid-value">on</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Background</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#0a0a0a" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#0a0a0a</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Primary Geometry</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#ffffff" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#ffffff</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Mid-tone</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#808080" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#808080</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Fragment Highlight</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#e6e6e6" onchange="updateColor('color4', this.value)">
                        <span class="color-value" id="color4-value">#e6e6e6</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Shadow Tone</label>
                    <div class="color-picker-container">
                        <input type="color" id="color5" value="#2a2a2a" onchange="updateColor('color5', this.value)">
                        <span class="color-value" id="color5-value">#2a2a2a</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="initializeSystem()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="downloadPNG()" style="margin-top: 8px;">Download PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 42,
            ringCount: 5,
            rayCount: 24,
            starBlades: 12,
            rotationSpeed: 0.0025,
            fragmentDensity: 24,
            invertInterval: 120,
            lineWeight: 1.5,
            perspectiveGrid: 1,
            colorPalette: ['#0a0a0a', '#ffffff', '#808080', '#e6e6e6', '#2a2a2a']
        };

        const defaultParams = JSON.parse(JSON.stringify(params));
        const structuralParams = ['ringCount', 'rayCount', 'starBlades', 'fragmentDensity'];

        let fragments = [];
        let rings = [];
        let canvas;
        let lastInvert = 0;
        let inverted = false;

        function setup() {
            canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            frameRate(30);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            buildRings();
            buildFragments();
            lastInvert = 0;
            inverted = false;

            background(params.colorPalette[0]);
        }

        function buildRings() {
            rings = [];
            const maxR = width * 0.45;
            for (let i = 0; i < params.ringCount; i++) {
                const t = (i + 1) / (params.ringCount + 1);
                rings.push({
                    r: maxR * t,
                    speed: (random() > 0.5 ? 1 : -1) * (params.ringCount - i + 1) * 0.3,
                    nodeCount: floor(8 + t * 24),
                    opacity: map(i, 0, params.ringCount - 1, 0.9, 0.35)
                });
            }
        }

        function buildFragments() {
            fragments = [];
            const cx = width / 2;
            const cy = height / 2;
            for (let i = 0; i < params.fragmentDensity; i++) {
                const angle = random(TWO_PI);
                const speed = random(4, 14);
                fragments.push({
                    pos: createVector(cx, cy),
                    vel: p5.Vector.fromAngle(angle).mult(speed),
                    angle: random(TWO_PI),
                    aVel: random(-0.12, 0.12),
                    type: random(['triangle', 'blade', 'diamond', 'square']),
                    size: random(20, 160),
                    life: 1,
                    delay: floor(random(60, 300))
                });
            }
        }

        function draw() {
            const bg = color(params.colorPalette[0]);
            const fg = color(params.colorPalette[1]);
            const mid = color(params.colorPalette[2]);
            const fragHi = color(params.colorPalette[3]);
            const shadow = color(params.colorPalette[4]);

            if (params.invertInterval > 0 && frameCount - lastInvert >= params.invertInterval) {
                inverted = !inverted;
                lastInvert = frameCount;
            }

            let drawBg = bg;
            let drawFg = fg;
            if (inverted) {
                drawBg = color(255 - red(bg), 255 - green(bg), 255 - blue(bg));
                drawFg = color(255 - red(fg), 255 - green(fg), 255 - blue(fg));
            }

            background(drawBg);

            const cx = width / 2;
            const cy = height / 2;
            const t = frameCount * params.rotationSpeed;

            if (params.perspectiveGrid) {
                drawPerspectiveGrid(cx, cy, drawFg);
            }

            push();
            translate(cx, cy);

            noFill();
            strokeWeight(params.lineWeight);

            for (let i = 0; i < rings.length; i++) {
                const ring = rings[i];
                const rot = t * ring.speed;
                const ringCol = inverted ? drawFg : color(red(fg), green(fg), blue(fg), ring.opacity * 255);
                stroke(ringCol);
                ellipse(0, 0, ring.r * 2, ring.r * 2);

                for (let j = 0; j < ring.nodeCount; j++) {
                    const a = j * TWO_PI / ring.nodeCount + rot;
                    const x = ring.r * cos(a);
                    const y = ring.r * sin(a);
                    const nextRing = rings[i + 1];
                    if (nextRing) {
                        const na = j * TWO_PI / nextRing.nodeCount + t * nextRing.speed;
                        const nx = nextRing.r * cos(na);
                        const ny = nextRing.r * sin(na);
                        strokeWeight(params.lineWeight * 0.5);
                        stroke(inverted ? drawFg : mid);
                        line(x, y, nx, ny);
                        strokeWeight(params.lineWeight);
                    }
                }
            }

            drawRadialRays(0, 0, params.rayCount, width * 0.55, t, inverted ? drawFg : mid);

            const starR = width * 0.18;
            const starType = (params.seed % 3 === 0) ? 'blade' : 'rounded';
            if (starType === 'blade') {
                drawBladeStar(0, 0, params.starBlades, starR, t * 1.5, inverted ? drawFg : drawFg);
                drawBladeStar(0, 0, params.starBlades, starR * 0.65, -t * 2, inverted ? drawFg : mid);
            } else {
                drawRoundedFlower(0, 0, starR, starR * 0.14, t, inverted ? drawFg : drawFg);
                drawRoundedFlower(0, 0, starR * 0.6, starR * 0.1, -t * 1.2, inverted ? drawFg : mid);
            }

            pop();

            for (const f of fragments) {
                if (frameCount < f.delay) continue;
                f.pos.add(f.vel);
                f.vel.mult(0.92);
                const toCenter = createVector(cx - f.pos.x, cy - f.pos.y).mult(0.003);
                f.pos.add(toCenter);
                f.angle += f.aVel;
                f.life -= 0.003;

                if (f.life <= 0) {
                    f.pos.set(cx, cy);
                    const angle = random(TWO_PI);
                    f.vel = p5.Vector.fromAngle(angle).mult(random(4, 14));
                    f.life = 1;
                    f.delay = frameCount + floor(random(60, 240));
                }

                push();
                translate(f.pos.x, f.pos.y);
                rotate(f.angle);
                const fc = inverted ? drawFg : fragHi;
                fill(red(fc), green(fc), blue(fc), f.life * 200);
                noStroke();
                const s = f.size * f.life;
                if (f.type === 'triangle') {
                    triangle(-s * 0.5, s * 0.4, s * 0.5, s * 0.4, 0, -s * 0.6);
                } else if (f.type === 'blade') {
                    beginShape();
                    vertex(-s * 0.18, -s * 0.5);
                    vertex(s * 0.18, -s * 0.5);
                    vertex(s * 0.08, s * 0.5);
                    vertex(-s * 0.08, s * 0.5);
                    endShape(CLOSE);
                } else if (f.type === 'diamond') {
                    quad(0, -s * 0.5, s * 0.45, 0, 0, s * 0.5, -s * 0.45, 0);
                } else {
                    rectMode(CENTER);
                    rect(0, 0, s, s);
                }
                pop();
            }

            if (inverted && frameCount - lastInvert > 8) {
                inverted = false;
            }
        }

        function drawPerspectiveGrid(cx, cy, c) {
            const horizon = height * 0.72;
            const focal = 340;
            let zMove = frameCount * 2;
            strokeWeight(params.lineWeight * 0.5);

            for (let z = 20; z < 4000; z += 80) {
                let depth = z + zMove;
                depth = depth % 4000;
                let y = horizon + focal * 140 / depth;
                let alpha = map(depth, 20, 4000, 160, 15);
                if (alpha < 0) alpha = 0;
                stroke(red(c), green(c), blue(c), alpha);
                line(0, y, width, y);
            }

            for (let x = -width; x <= width * 2; x += 100) {
                noFill();
                beginShape();
                for (let z = 20; z < 4000; z += 60) {
                    let depth = z + zMove;
                    depth = depth % 4000;
                    let y = horizon + focal * 140 / depth;
                    let sx = cx + (x - cx) * focal / depth;
                    let bend = 0.000015 * pow(x - cx, 2) * (depth / 1000);
                    vertex(sx, y - bend);
                }
                stroke(red(c), green(c), blue(c), 40);
                endShape();
            }
        }

        function drawRadialRays(cx, cy, n, r, rot, c) {
            push();
            translate(cx, cy);
            rotate(rot * 0.5);
            stroke(c);
            strokeWeight(params.lineWeight * 0.6);
            for (let i = 0; i < n; i++) {
                const a = (i / n) * TWO_PI;
                const alpha = map(i % 3, 0, 2, 30, 120);
                stroke(red(c), green(c), blue(c), alpha);
                line(0, 0, cos(a) * r, sin(a) * r);
            }
            pop();
        }

        function drawRoundedFlower(cx, cy, R, w, rot, fillCol) {
            push();
            translate(cx, cy);
            rotate(rot);
            fill(fillCol);
            noStroke();
            const step = Math.PI * 2 / 8;
            for (let i = 0; i < 8; i++) {
                rotate(step);
                beginShape();
                vertex(0, 0);
                bezierVertex(w, -R * 0.45, w, -R, 0, -R);
                bezierVertex(-w, -R, -w, -R * 0.45, 0, 0);
                endShape(CLOSE);
            }
            pop();
        }

        function drawBladeStar(cx, cy, n, R, rot, fillCol) {
            push();
            translate(cx, cy);
            rotate(rot);
            fill(fillCol);
            noStroke();
            for (let i = 0; i < n; i++) {
                push();
                rotate((i / n) * TWO_PI);
                beginShape();
                vertex(0, 0);
                vertex(-R * 0.08, -R * 0.35);
                vertex(0, -R);
                vertex(R * 0.08, -R * 0.35);
                endShape(CLOSE);
                pop();
            }
            pop();
        }

        function updateParam(paramName, value) {
            const num = parseFloat(value);
            params[paramName] = num;

            if (paramName === 'rotationSpeed') {
                params.rotationSpeed = num / 10000;
                document.getElementById('rotationSpeed-value').textContent = params.rotationSpeed.toFixed(4);
            } else if (paramName === 'perspectiveGrid') {
                document.getElementById('perspectiveGrid-value').textContent = num ? 'on' : 'off';
            } else {
                document.getElementById(paramName + '-value').textContent = value;
            }

            if (structuralParams.includes(paramName)) {
                buildRings();
                buildFragments();
            }
        }

        function updateColor(colorId, value) {
            const idx = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            const input = document.getElementById('seed-input');
            const newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function jumpToSeed() {
            const input = document.getElementById('jump-input');
            const newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                updateSeedDisplay();
                initializeSystem();
            }
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            document.getElementById('ringCount').value = params.ringCount;
            document.getElementById('ringCount-value').textContent = params.ringCount;
            document.getElementById('rayCount').value = params.rayCount;
            document.getElementById('rayCount-value').textContent = params.rayCount;
            document.getElementById('starBlades').value = params.starBlades;
            document.getElementById('starBlades-value').textContent = params.starBlades;
            document.getElementById('rotationSpeed').value = 25;
            document.getElementById('rotationSpeed-value').textContent = params.rotationSpeed.toFixed(4);
            document.getElementById('fragmentDensity').value = params.fragmentDensity;
            document.getElementById('fragmentDensity-value').textContent = params.fragmentDensity;
            document.getElementById('invertInterval').value = params.invertInterval;
            document.getElementById('invertInterval-value').textContent = params.invertInterval;
            document.getElementById('lineWeight').value = params.lineWeight;
            document.getElementById('lineWeight-value').textContent = params.lineWeight;
            document.getElementById('perspectiveGrid').value = params.perspectiveGrid;
            document.getElementById('perspectiveGrid-value').textContent = params.perspectiveGrid ? 'on' : 'off';

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            document.getElementById('color4').value = params.colorPalette[3];
            document.getElementById('color4-value').textContent = params.colorPalette[3];
            document.getElementById('color5').value = params.colorPalette[4];
            document.getElementById('color5-value').textContent = params.colorPalette[4];

            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas(canvas, 'radial-brutalism-seed-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
