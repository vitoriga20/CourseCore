<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 深色主题渐变 -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- 蛇身渐变：青色到紫色 -->
    <linearGradient id="snake-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- 几何网格线渐变 -->
    <linearGradient id="grid-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>

    <!-- 内部高光 -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- 投影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22d3ee" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景圆角方块 -->
  <rect width="128" height="128" rx="28" fill="url(#bg-dark)"/>

  <!-- 几何网格装饰（呼应 Canvas 球面网格背景） -->
  <g stroke="url(#grid-gradient)" stroke-width="1" fill="none" opacity="0.6">
    <!-- 垂直弧线 -->
    <path d="M28 16 C 28 64, 28 64, 28 112" />
    <path d="M48 16 C 48 64, 48 64, 48 112" />
    <path d="M80 16 C 80 64, 80 64, 80 112" />
    <path d="M100 16 C 100 64, 100 64, 100 112" />
    <!-- 水平弧线 -->
    <path d="M16 36 C 64 36, 64 36, 112 36" />
    <path d="M16 64 C 64 64, 64 64, 112 64" />
    <path d="M16 92 C 64 92, 64 92, 112 92" />
  </g>

  <!-- 内部高光 -->
  <circle cx="64" cy="64" r="48" fill="url(#glow)"/>

  <!-- 蛇形几何主体 -->
  <!-- 用多段直线/折线构成抽象的盘绕蛇形，参考贪吃蛇+几何网格 -->
  <g filter="url(#shadow)">
    <!-- 蛇身主体 -->
    <path
      d="M 34 82
         L 34 58
         L 58 58
         L 58 74
         L 70 74
         L 70 50
         L 46 50
         L 46 34
         L 82 34
         L 82 82
         L 94 82"
      fill="none"
      stroke="url(#snake-gradient)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 蛇身分段线，强调几何感 -->
    <g stroke="#0f172a" stroke-width="2" opacity="0.8">
      <line x1="46" y1="58" x2="46" y2="52"/>
      <line x1="58" y1="66" x2="58" y2="58"/>
      <line x1="70" y1="62" x2="70" y2="50"/>
      <line x1="58" y1="42" x2="58" y2="34"/>
      <line x1="82" y1="58" x2="82" y2="82"/>
    </g>

    <!-- 蛇头：菱形几何眼睛 -->
    <polygon points="88,76 100,82 88,88" fill="#22d3ee"/>
    <circle cx="94" cy="82" r="3.5" fill="#0f172a"/>
    <circle cx="95" cy="81" r="1.2" fill="#ffffff"/>

    <!-- 蛇尾尖端 -->
    <polygon points="34,88 28,82 34,76" fill="#a855f7"/>
  </g>

  <!-- 核心节点（像电路节点/几何顶点） -->
  <g>
    <circle cx="34" cy="82" r="3" fill="#a855f7"/>
    <circle cx="34" cy="58" r="3" fill="#818cf8"/>
    <circle cx="58" cy="58" r="3" fill="#22d3ee"/>
    <circle cx="58" cy="74" r="3" fill="#22d3ee"/>
    <circle cx="70" cy="74" r="3" fill="#818cf8"/>
    <circle cx="70" cy="50" r="3" fill="#a855f7"/>
    <circle cx="46" cy="50" r="3" fill="#22d3ee"/>
    <circle cx="46" cy="34" r="3" fill="#818cf8"/>
    <circle cx="82" cy="34" r="3" fill="#a855f7"/>
    <circle cx="82" cy="82" r="3" fill="#22d3ee"/>
  </g>
</svg>
